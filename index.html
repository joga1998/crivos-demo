autonomia do pol├¡tico, cultura pol├¡tica (pp. 23, 35ÔÇô36).<\/li><li>Mendon├ºa & Fontes: cr├¡tica e Estado ampliado (pp. 59ÔÇô69).<\/li><li>Pontos de converg├¬ncia: institui├º├Áes n├úo neutras (R├®mond, p. 24).<\/li><li>Conclus├úo: hist├│ria social do pol├¡tico.<\/li><\/ul>"}, {"sec": "linha", "q": "<b>Apostila.<\/b> Quais os desafios metodol├│gicos de uma hist├│ria \"de baixo para cima\"? Responda com Hobsbawm e Thompson.", "esq": "<ul><li>Fontes e perguntas (Hobsbawm, PDF p. 5).<\/li><li>Mem├│ria (PDF pp. 6ÔÇô7).<\/li><li>A multid├úo e a no├º├úo legitimadora (Thompson, p. 152).<\/li><li>Governantes e governados (Hobsbawm, PDF p. 12). Conclus├úo.<\/li><\/ul>"}], "rubric": "<h2>7.3 Grade de autocorre├º├úo (0ÔÇô10)<\/h2>\n<table><tr><th>Crit├®rio<\/th><th>Peso<\/th><th>Pergunte-se<\/th><\/tr>\n<tr><td>Pertin├¬ncia<\/td><td>2,5<\/td><td>Respondi exatamente o que foi pedido (verbos de comando)?<\/td><\/tr>\n<tr><td>Dom├¡nio dos textos<\/td><td>3,0<\/td><td>Conceitos corretos e bem definidos? Pelo menos 3 autores pertinentes?<\/td><\/tr>\n<tr><td>Articula├º├úo<\/td><td>2,0<\/td><td>Houve di├ílogo (converg├¬ncia e tens├úo) e liga├º├úo com territ├│rio e poder?<\/td><\/tr>\n<tr><td>Argumenta├º├úo e estrutura<\/td><td>1,5<\/td><td>Tese clara, blocos l├│gicos, conclus├úo que responde?<\/td><\/tr>\n<tr><td>L├¡ngua<\/td><td>1,0<\/td><td>Clareza, corre├º├úo, letra leg├¡vel?<\/td><\/tr>\n<\/table>\n<p class=\"small\">A grade ├® uma ferramenta de estudo. O edital n├úo publica crit├®rios de corre├º├úo detalhados.<\/p>\n", "arg": [{"cat": "A. Problema, recorte e natureza hist├│rica", "p": "1. Em que o seu trabalho ├® hist├│ria, e n├úo sociologia ou antropologia das organiza├º├Áes militares?", "r": "O projeto n├úo pergunta s├│ como a hierarquia funciona: pergunta como ela chegou a funcionar assim e quais processos a sustentam ou tensionam. Isso se faz pela genealogia documental (regulamentos de 1955 a 2022, ordens do dia, RMB desde os anos 1970, DPHDM), pela an├ílise de perman├¬ncias e ressignifica├º├Áes (Koselleck: camadas temporais; Thompson: o costume como passado atuante) e pela hist├│ria do tempo presente (R├®mond; Delgado &amp; Ferreira). Castro e Leirner entram como interlocutores da antropologia, e n├úo como modelo."}, {"cat": "A. Problema, recorte e natureza hist├│rica", "p": "2. Por que 1988, se hierarquia e disciplina j├í estavam no Estatuto de 1980?", "r": "O projeto reconhece isso. O problema n├úo ├® a origem dos princ├¡pios, mas as condi├º├Áes que a redemocratiza├º├úo criou para sua continuidade e ressignifica├º├úo: art. 142, Minist├®rio da Defesa (1999), mudan├ºas de forma├º├úo e de composi├º├úo. 1988 ├® marco de contexto, n├úo de ruptura suposta. O passado anterior entra de forma seletiva."}, {"cat": "A. Problema, recorte e natureza hist├│rica", "p": "3. At├® onde vai o \"presente\"? Como lidar com a falta de dist├óncia?", "r": "O presente ├® o ponto de partida emp├¡rico. A dist├óncia ├® constru├¡da por m├®todo: cruzamento de fontes, registro reflexivo, historiciza├º├úo das normas. R├®mond defende a legitimidade do tempo presente. Os limites (acesso a arquivos recentes, envolvimento) s├úo enfrentados explicitamente."}, {"cat": "A. Problema, recorte e natureza hist├│rica", "p": "4. A pergunta n├úo ├® ampla demais para um mestrado?", "r": "A redu├º├úo de escala responde a isso: uma OM, situa├º├Áes e trajet├│rias concretas, e um conjunto documental delimitado. A pergunta ├® ampla em alcance, mas operacionalizada em tr├¬s dimens├Áes (norma, pr├ítica, experi├¬ncia) e em objetivos espec├¡ficos verific├íveis. Se precisar, ofere├ºa um recorte adicional, por exemplo priorizar os regulamentos e um per├¡odo da RMB."}, {"cat": "A. Problema, recorte e natureza hist├│rica", "p": "5. O que exatamente ├® \"autoridade informal\"? Como voc├¬ vai reconhec├¬-la nas fontes?", "r": "├ë o reconhecimento da capacidade de orientar, influenciar, mediar ou produzir condutas sem que isso derive s├│ da posi├º├úo hier├írquica. Indicadores observ├íveis: quem ├® consultado, ouvido ou chamado a resolver; quem corrige pares; quem ├® citado nas entrevistas como refer├¬ncia; em que espa├ºos e situa├º├Áes isso acontece. N├úo se trata de uma \"segunda hierarquia\", e sim de uma n├úo coincid├¬ncia situacional."}, {"cat": "B. Territ├│rio e Linha 1", "p": "6. Onde est├í o territ├│rio no seu projeto? N├úo ├® s├│ uma met├ífora?", "r": "N├úo ├® met├ífora. Haesbaert define territ├│rio pelas rela├º├Áes de poder exercidas com e pelo espa├ºo, e lista entre os fins da territorializa├º├úo o <b>controle e a disciplinariza├º├úo atrav├®s do espa├ºo<\/b>. Com Sack, territorialidade ├® controle de acesso. A OM tem limites jur├¡dicos e f├¡sicos, acesso controlado e interior recortado por c├¡rculos. A lei pensa a hierarquia espacialmente: o art. 15 do Estatuto define os c├¡rculos como \"├ómbitos de conviv├¬ncia\". Ao mesmo tempo, os militares se apropriam do espa├ºo (setores t├®cnicos, intervalos, espa├ºos de conv├¡vio). O territ├│rio ├® uma das linguagens da autoridade, e n├úo um cen├írio."}, {"cat": "B. Territ├│rio e Linha 1", "p": "7. Por que a Linha 1, se o projeto n├úo trata de movimentos sociais?", "r": "A ementa da linha abrange as \"formas de Estado, poder e grupos sociais formal ou informalmente organizados\", as institui├º├Áes p├║blicas e \"as rela├º├Áes cotidianas entre e no interior de diferentes movimentos e grupamentos sociais\" (texto da p├ígina do PPGHS). O projeto estuda rela├º├Áes de poder no interior de uma institui├º├úo estatal. Com Poulantzas e Mendon├ºa &amp; Fontes, o Estado ├® rela├º├úo, e seus aparelhos tamb├®m s├úo atravessados por rela├º├Áes e tens├Áes."}, {"cat": "B. Territ├│rio e Linha 1", "p": "8. Como o projeto dialoga com a bibliografia da Linha?", "r": "R├®mond: legitimidade da hist├│ria pol├¡tica renovada e do tempo presente. Hobsbawm: o problema das fontes sobre os \"de baixo\" (as pra├ºas, ausentes da RMB) e a hist├│ria oral com cautela. Thompson: costume e no├º├úo legitimadora, uma \"economia moral\" da autoridade que define o que se reconhece como ordem leg├¡tima. Poulantzas e M&amp;F: as For├ºas Armadas como parte da sociedade pol├¡tica e da ossatura do Estado, sem homogeneidade interna."}, {"cat": "B. Territ├│rio e Linha 1", "p": "9. Multiterritorialidade \"em escala institucional\" n├úo ├® for├ºar o conceito?", "r": "O projeto diz \"adaptada\", e ├® preciso deixar o cuidado expl├¡cito. Haesbaert distingue a multiterritorialidade em sentido amplo (multipertencimento, territ├│rios \"encaixados\" em escalas, como em Barel) da multiterritorialidade em sentido estrito (contempor├ónea, em rede). O uso no projeto est├í mais perto do sentido amplo: o militar circula por territ├│rios encaixados (OM, c├¡rculo, especialidade, grupo de trabalho). Reconhecer isso mostra dom├¡nio."}, {"cat": "C. Teoria", "p": "10. Bourdieu, Elias, Goffman, Lefebvre e micro-hist├│ria: n├úo ├® ecletismo?", "r": "Os eixos funcionam em sequ├¬ncia, e n├úo como compartimentos: a escala define o que se v├¬, o espa├ºo onde a hierarquia se materializa, o poder como a autoridade ├® reconhecida, a hist├│ria oral como ├® vivida. Bourdieu e Elias compartilham uma vis├úo relacional. Goffman ├® condicional (s├│ se o campo envolver perman├¬ncia prolongada). Se pedirem prioridade, o n├║cleo ├® micro-hist├│ria + territ├│rio + poder relacional."}, {"cat": "C. Teoria", "p": "11. Por que n├úo Foucault, se o tema ├® disciplina e espa├ºo?", "r": "Foucault ├® interlocutor ├│bvio (o espa├ºo disciplinar, a vigil├óncia). O projeto optou por enfatizar o reconhecimento e a autoridade (poder simb├│lico, figura├º├Áes), e n├úo os dispositivos disciplinares em si, tratando a disciplina como meio. Pode-se incorporar Foucault na revis├úo bibliogr├ífica, e o pr├│prio Haesbaert dialoga com a ideia de sociedade disciplinar. Mostre abertura, sem defensividade."}, {"cat": "C. Teoria", "p": "12. Winston Parva ├® uma comunidade, n├úo uma institui├º├úo hier├írquica. A analogia funciona?", "r": "├ë usada como <b>modelo de figura├º├úo<\/b>, e n├úo como equival├¬ncia: mostra que o tempo de pertencimento e a coes├úo podem ser recurso de poder independente da posi├º├úo formal. Na Marinha, a antiguidade ├® tamb├®m categoria regulamentar (art. 17 do Estatuto). O interesse est├í no ponto em que a antiguidade formal se desdobra em \"tempo de casa, de bordo, de especialidade\". A hip├│tese ser├í testada, e as evid├¬ncias contr├írias ser├úo consideradas."}, {"cat": "C. Teoria", "p": "13. Como Bourdieu (\"efeitos de lugar\") e Lefebvre (concebido, percebido, vivido) se articulam?", "r": "Lefebvre fornece a tr├¡ade correspondente a norma (concebido), pr├ítica (percebido) e experi├¬ncia (vivido). Bourdieu explica como a posi├º├úo no espa├ºo social se traduz no espa├ºo f├¡sico: o lugar ocupado e os lugares acess├¡veis. O uniforme leva essa posi├º├úo para onde o corpo vai."}, {"cat": "C. Teoria", "p": "14. Qual a rela├º├úo entre a escala micro e as quest├Áes \"de maior alcance\"?", "r": "Levi: reduzir a escala ├® um procedimento anal├¡tico, e n├úo a escolha de um objeto pequeno. Revel: mudar a escala muda o que se v├¬. Ginzburg: ind├¡cios revelam estruturas. A OM n├úo representa a For├ºa, mas permite levantar quest├Áes gerais, como a persist├¬ncia da autonomia corporativa por dentro, nas normas e rituais."}, {"cat": "D. Fontes e m├®todo", "p": "15. A RMB de 1970 at├® hoje ├® um corpus enorme. Como vai trabalhar?", "r": "Com um levantamento por descritores (lideran├ºa, disciplina, hierarquia, tradi├º├úo, forma├º├úo) e uma amostragem em torno de marcos (fim dos anos 1970 e 1980, 1988, 1999, anos 2000, d├®cada de 2010 e 2020), com planilha de fichamento. <span class=\"inc\">ÔÜá verifique antes da argui├º├úo se a RMB tem acervo digitalizado e ├¡ndices, e mencione isso<\/span>"}, {"cat": "D. Fontes e m├®todo", "p": "16. Por que comparar regulamentos? O que espera encontrar?", "r": "O que foi mantido, suprimido ou reescrito nas formas de tratamento, preced├¬ncias, sinais de respeito, contraven├º├Áes e garantias do punido, e se as mudan├ºas acompanham o quadro constitucional. A passagem do decreto presidencial ├á portaria ministerial (2009) j├í ├® ind├¡cio da reconfigura├º├úo p├│s-1999. ├ë, na pr├ítica, uma hist├│ria dos conceitos normativos (Koselleck)."}, {"cat": "D. Fontes e m├®todo", "p": "17. Entrevista n├úo ├® relato transparente. Como tratar a fonte oral?", "r": "Com Alberti (a entrevista como produ├º├úo documental planejada e contextualizada) e Portelli (o valor est├í tamb├®m nos significados atribu├¡dos pelo narrador). A mem├│ria ├® objeto e fonte. O cruzamento com normas, observa├º├úo e documentos ├® o controle, e a diverg├¬ncia ├® dado."}, {"cat": "D. Fontes e m├®todo", "p": "18. Por que 10 a 16 entrevistas? Com que crit├®rio para?", "r": "Sele├º├úo intencional pela diversidade de posi├º├Áes (oficiais e pra├ºas), de gera├º├Áes (in├¡cio, meio e fim de carreira, ingressos em momentos diferentes) e de fun├º├Áes (administrativas, t├®cnicas, operacionais). O n├║mero final depende da capacidade do conjunto de responder ao problema (crit├®rio de sufici├¬ncia ou satura├º├úo)."}, {"cat": "D. Fontes e m├®todo", "p": "19. O que voc├¬ far├í se as fontes contrariarem as hip├│teses?", "r": "O projeto prev├¬ confrontar as hip├│teses com as evid├¬ncias contr├írias. Uma hip├│tese refutada tamb├®m ├® resultado. Por exemplo: se a autoridade efetiva coincidir com a formal, o achado ├® a efic├ícia da norma no p├│s-1988, o que tamb├®m responde ├á pergunta."}, {"cat": "D. Fontes e m├®todo", "p": "20. Os Sinais de Barroso n├úo seriam uma \"tradi├º├úo inventada\"?", "r": "├ë uma ├│tima chave. Hobsbawm e Ranger (bibliografia da Linha 2) mostram como tradi├º├Áes s├úo constru├¡das e repetidas para produzir continuidade. O projeto quer ver o que a frase significa hoje, e n├úo supor continuidade de sentido (3┬¬ hip├│tese). A frase ├® frequentemente associada ao sinal de Nelson em Trafalgar (\"England expects...\"). Se for mencionar isso, diga \"costuma-se associar\" e trate como tema a verificar na pesquisa."}, {"cat": "E. Posi├º├úo do pesquisador, acesso e ├®tica", "p": "21. Voc├¬ ├® militar da Marinha [ou tem inser├º├úo profissional nela]. Como garante distanciamento?", "r": "Proximidade ├® condi├º├úo de acesso e problema metodol├│gico. Gilberto Velho: o familiar n├úo ├® necessariamente conhecido, e ├® preciso estranh├í-lo deliberadamente. Medidas: registro reflexivo separado; cruzamento sistem├ítico de fontes; n├úo uso de informa├º├Áes obtidas s├│ pela fun├º├úo; exclus├úo de subordinados diretos e prefer├¬ncia por pessoas sem rela├º├úo funcional imediata. Com Certeau: explicitar o pr├│prio lugar social ├® parte da opera├º├úo historiogr├ífica."}, {"cat": "E. Posi├º├úo do pesquisador, acesso e ├®tica", "p": "22. Seu posto ou gradua├º├úo n├úo intimida os entrevistados (ou, ao contr├írio, impede que superiores se abram)?", "r": "[Responda com a sua situa├º├úo real.] Medidas do projeto: convite fora da cadeia de comando, entrevista sem superiores presentes, recusa sem consequ├¬ncia, anonimato desde a transcri├º├úo. Sugest├Áes adicionais, que n├úo est├úo no texto e s├│ valem se vi├íveis: entrevistas fora da OM e do expediente, em ambiente neutro."}, {"cat": "E. Posi├º├úo do pesquisador, acesso e ├®tica", "p": "23. E se o comando n├úo autorizar a observa├º├úo?", "r": "O n├║cleo documental ├® p├║blico e garante a viabilidade (se├º├úo 5 do projeto). Plano B a apresentar como desdobramento, e n├úo como algo j├í previsto no texto: ampliar a hist├│ria oral com militares da reserva ou de outras OMs recrutados fora da cadeia de comando (sempre com aprova├º├úo do CEP) e aprofundar a s├®rie normativa, a RMB e as ordens do dia."}, {"cat": "E. Posi├º├úo do pesquisador, acesso e ├®tica", "p": "24. Como garantir voluntariedade numa institui├º├úo hier├írquica?", "r": "Convite fora da cadeia de comando; TCLE; possibilidade de desist├¬ncia a qualquer momento sem consequ├¬ncia; nenhuma entrevista na presen├ºa de superiores; nenhuma finalidade de avalia├º├úo funcional ou disciplinar."}, {"cat": "E. Posi├º├úo do pesquisador, acesso e ├®tica", "p": "25. E o sigilo? A Marinha n├úo vai querer revisar o texto?", "r": "A pesquisa exclui dados operacionais, classificados e de acesso restrito, e nada sobre seguran├ºa das instala├º├Áes ├® registrado. A identidade da OM e dos participantes ├® preservada. Se a anu├¬ncia impuser condi├º├Áes, como revis├úo pr├®via, deve-se negoci├í-las preservando a autonomia acad├¬mica, com apoio da orienta├º├úo e do CEP. <span class=\"inc\">ÔÜá ponto n├úo tratado no pr├®-projeto; responda com prud├¬ncia<\/span>"}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "26. ├ë vi├ível em 24 meses?", "r": "Proposta de cronograma: meses 1ÔÇô6, disciplinas, revis├úo bibliogr├ífica, levantamento normativo e submiss├úo ao CEP; meses 6ÔÇô12, RMB, ordens do dia e DPHDM, com anu├¬ncia e in├¡cio do campo; meses 12ÔÇô18, entrevistas e observa├º├úo, transcri├º├úo e qualifica├º├úo; meses 18ÔÇô24, an├ílise e reda├º├úo. A parte documental come├ºa antes do campo."}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "27. Qual a contribui├º├úo para a historiografia?", "r": "Na literatura consultada, a historiografia social da Marinha concentra-se no Imp├®rio e na Primeira Rep├║blica (Nascimento, Arias Neto, a Chibata), e o p├│s-1988 aparece sobretudo na ci├¬ncia pol├¡tica (Zaverucha, Martins Filho), focada na c├║pula. O projeto prop├Áe outra escala: o cotidiano. <span class=\"inc\">ÔÜá antes da argui├º├úo, fa├ºa uma busca r├ípida no Cat├ílogo de Teses da CAPES e na BDTD por \"Marinha\" + \"hierarquia\" ou \"cotidiano\" depois de 1988, para n├úo ser surpreendido<\/span>"}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "28. E g├¬nero e ra├ºa? A composi├º├úo dos efetivos mudou (por exemplo, com a presen├ºa de mulheres).", "r": "O projeto menciona \"mudan├ºas na composi├º├úo social dos efetivos\", mas n├úo desenvolve g├¬nero e ra├ºa. Reconhe├ºa a lacuna e proponha trat├í-las como vari├íveis transversais na sele├º├úo dos entrevistados e na an├ílise. A historiografia citada (Nascimento sobre cor e disciplina em 1910) mostra que hierarquia naval e hierarquias sociais se cruzam. <span class=\"inc\">ÔÜá confirme datas e marcos legais sobre o ingresso de mulheres na Marinha antes de citar<\/span>"}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "29. Voc├¬ se formou h├í algum tempo. Por que o mestrado agora e por que o PPGHS?", "r": "[Responda com a sua trajet├│ria real.] Ligue a experi├¬ncia profissional ├á pergunta de pesquisa e explique por que a ├írea (territ├│rio) e a Linha 1 s├úo o lugar certo (ementa). Mostre que conhece o Programa: semin├írio interno, linhas, docentes."}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "30. Como vai conciliar o mestrado com o trabalho? Tem disponibilidade?", "r": "[Responda com honestidade.] Mostre um plano concreto: hor├írios, licen├ºa se houver, presen├ºa nas disciplinas, cumprimento de prazos. A banca quer ver que voc├¬ conhece as exig├¬ncias do curso."}, {"cat": "F. Viabilidade, contribui├º├úo e trajet├│ria", "p": "31. Sobre a sua prova escrita: por que escolheu essa quest├úo? Desenvolva o ponto X.", "r": "Releia o que escreveu (anote logo depois da prova). Esteja pronto para aprofundar um conceito ou corrigir, com tranquilidade, algo que tenha ficado impreciso (\"hoje formularia melhor assim...\")."}], "fracos": "<h2>8.4 Pontos fr├ígeis do projeto e como defend├¬-los<\/h2>\n<table>\n<tr><th style=\"width:18%\">Ponto<\/th><th style=\"width:30%\">Por que a banca pode tocar nele<\/th><th>Linha de defesa<\/th><\/tr>\n<tr><td><b>Tipo de OM<\/b> (n├úo informado no texto, por escolha sua)<\/td><td>Sem saber se ├® navio, base, escola ou OM administrativa, a banca n├úo avalia viabilidade, nem se Goffman se aplica.<\/td><td>Tenha uma resposta pronta, curta e fechada: \"Trata-se de uma OM de [tipo], escolhida por [crit├®rios]\". Crit├®rios defens├íveis: (1) diversidade de c├¡rculos, especialidades e gera├º├Áes no efetivo; (2) rotina cerimonial regular (formaturas, Dia da Marinha); (3) perman├¬ncia do efetivo que permita observar conviv├¬ncia; (4) aus├¬ncia de atividades cuja observa├º├úo envolva informa├º├úo sens├¡vel; (5) viabilidade de anu├¬ncia. Explique por que n├úo identifica a OM no texto (preserva├º├úo dos participantes) e diga se Goffman se aplica ou n├úo a esse tipo. Tenha um <b>plano B<\/b> (outro tipo de OM) j├í pensado.<\/td><\/tr>\n<tr><td><b>Acesso / anu├¬ncia<\/b> (deixado para a entrevista)<\/td><td>Sem anu├¬ncia n├úo h├í observa├º├úo nem documentos internos. A banca vai querer saber o grau de certeza.<\/td><td>Explique em que p├® est├í [contato informal? pedido formal? nada ainda?] e o caminho: anu├¬ncia do comando da OM e das inst├óncias competentes, depois CEP, e s├│ ent├úo o campo. Destaque que <b>tr├¬s dos quatro conjuntos documentais s├úo p├║blicos<\/b> e que o projeto foi desenhado para ser vi├ível mesmo com campo restrito. N├úo prometa o que n├úo tem.<\/td><\/tr>\n<tr><td><b>Posi├º├úo de insider<\/b><\/td><td>Risco de naturaliza├º├úo, vi├®s, conflito de pap├®is e press├úo sobre entrevistados.<\/td><td>Velho (estranhar o familiar), Certeau (explicitar o lugar), registro reflexivo, exclus├úo de subordinados, convite fora da cadeia de comando, n├úo uso de informa├º├úo funcional. Apresente a proximidade como <b>vantagem controlada<\/b>: dom├¡nio da linguagem e dos c├│digos.<\/td><\/tr>\n<tr><td><b>Viabilidade<\/b><\/td><td>CEP, anu├¬ncia, 10 a 16 entrevistas, RMB extensa e DPHDM em 24 meses.<\/td><td>Cronograma da pergunta 26; in├¡cio pelo n├║cleo documental; recortes de amostragem da RMB; n├║mero de entrevistas flex├¡vel.<\/td><\/tr>\n<tr><td><b>Liga├º├úo com o territ├│rio<\/b><\/td><td>Programa e ├írea exigem territ├│rio como categoria anal├¡tica.<\/td><td>Haesbaert (fins da territorializa├º├úo: disciplinariza├º├úo pelo espa├ºo; controle de acesso via Sack; territ├│rio formal ├ù territorialidade vivida), Lefebvre (tr├¡ade), Bourdieu (efeitos de lugar), dispositivo legal dos c├¡rculos. Suposi├º├úo test├ível: a autoridade informal tem localiza├º├úo.<\/td><\/tr>\n<tr><td><b>Fontes<\/b><\/td><td>RMB escrita por oficiais; ordens do dia oficiais; risco de ver s├│ o discurso institucional.<\/td><td>O sil├¬ncio sobre as pra├ºas ├® objeto de an├ílise (Hobsbawm: o problema das fontes dos de baixo), confrontado com as fontes orais. Ordens do dia lidas como mem├│ria institucional (Catroga). Regulamentos lidos diacronicamente (Koselleck). Diverg├¬ncia como dado.<\/td><\/tr>\n<tr><td><b>Natureza hist├│rica<\/b><\/td><td>Pode parecer estudo de organiza├º├úo, de corte sociol├│gico.<\/td><td>Pergunta 1: genealogia, perman├¬ncia e ressignifica├º├úo, tempo presente.<\/td><\/tr>\n<tr><td><b>Ecletismo te├│rico<\/b><\/td><td>Muitos autores para um mestrado.<\/td><td>Sequ├¬ncia articulada; Goffman condicional; n├║cleo claro.<\/td><\/tr>\n<tr><td><b>G├¬nero e ra├ºa<\/b><\/td><td>Ausentes do texto.<\/td><td>Reconhe├ºa e incorpore como vari├íveis transversais (pergunta 28).<\/td><\/tr>\n<tr><td><b>Refer├¬ncias<\/b><\/td><td>Pequenos desalinhamentos com a bibliografia do edital.<\/td><td>Haesbaert: o projeto diz \"p. 19-46\" e o edital \"p. 19 a 45\". Ginzburg: o projeto cita 1989 e o edital a reimpress├úo de 2003. N├úo muda nada no m├®rito, mas saiba explicar se perguntarem.<\/td><\/tr>\n<\/table>\n\n", "resumo": "<h2>8.1 O seu projeto em uma p├ígina (para memorizar)<\/h2>\n<table>\n<tr><th style=\"width:24%\">Elemento<\/th><th>Formula├º├úo<\/th><\/tr>\n<tr><td>T├¡tulo<\/td><td>\"O Brasil espera que cada um cumpra o seu dever\": hierarquia, autoridade e rela├º├Áes de poder na Marinha do Brasil (1988ÔÇôpresente)<\/td><\/tr>\n<tr><td>Objeto<\/td><td>A rela├º├úo entre a <b>hierarquia formal<\/b> (postos, gradua├º├Áes, regulamentos, preced├¬ncias) e as <b>formas informais de autoridade e reconhecimento<\/b> (antiguidade, experi├¬ncia, saber t├®cnico, trajet├│ria, prest├¡gio, dom├¡nio dos c├│digos) no cotidiano. A disciplina entra como meio de produ├º├úo dessa rela├º├úo.<\/td><\/tr>\n<tr><td>Pergunta central<\/td><td>Como formas historicamente constitu├¡das de autoridade e de hierarquia s├úo reproduzidas, transformadas e ressignificadas na experi├¬ncia cotidiana de integrantes da Marinha do Brasil depois da redemocratiza├º├úo?<\/td><\/tr>\n<tr><td>Recorte<\/td><td>1988 (CF, art. 142) at├® o presente; o passado entra de forma seletiva e \"geneal├│gica\" (por exemplo, os Sinais de Barroso, 1865; o Estatuto dos Militares, 1980). Di├ílogo com a hist├│ria do tempo presente.<\/td><\/tr>\n<tr><td>Campo emp├¡rico<\/td><td>Uma OM, que ├® campo e n├úo objeto, com identifica├º├úo preservada; redu├º├úo de escala micro-hist├│rica, sem pretens├úo de representar a For├ºa.<\/td><\/tr>\n<tr><td>Territ├│rio<\/td><td>Territ├│rio institucional como espa├ºo socialmente produzido: c├¡rculos hier├írquicos, circula├º├úo desigual, uniformes, preced├¬ncias. Polo da domina├º├úo e polo da apropria├º├úo (Haesbaert/Lefebvre); efeitos de lugar (Bourdieu); institui├º├úo total como recurso condicional (Goffman); multiterritorialidade em escala institucional.<\/td><\/tr>\n<tr><td>Teoria<\/td><td>Micro-hist├│ria (Levi, Revel, Ginzburg); territ├│rio (Haesbaert, Lefebvre); poder (Bourdieu: poder simb├│lico; Elias: interdepend├¬ncia; Elias &amp; Scotson: estabelecidos e outsiders); hist├│ria oral (Alberti, Portelli); reflexividade (Gilberto Velho).<\/td><\/tr>\n<tr><td>Hip├│teses<\/td><td>(1) As rela├º├Áes hier├írquicas n├úo resultam s├│ das normas: resultam tamb├®m da perman├¬ncia, transforma├º├úo e ressignifica├º├úo de pr├íticas e linguagens historicamente constitu├¡das. (2) A posi├º├úo formal n├úo esgota a autoridade: o tempo de grupo e a coes├úo dos antigos funcionam como recurso de poder pr├│prio (modelo de Elias &amp; Scotson). (3) Explorat├│ria: perman├¬ncia de estruturas sem reprodu├º├úo integral de seus significados.<\/td><\/tr>\n<tr><td>Fontes<\/td><td>(a) S├®ries normativas comparadas: CF/1988, Estatuto (Lei 6.880/1980), LC 97/1999, Regulamento de Contin├¬ncias (Dec. 88.513/1983 ÔåÆ Dec. 2.243/1997 ÔåÆ Dec. 6.806/2009 ÔåÆ Port. Normativa 660/MD/2009 ÔåÆ Port. GM-MD 1.143/2022), Regulamento Disciplinar para a Marinha (Dec. 38.010/1955 ÔåÆ Dec. 88.545/1983, alterado em 1986, 1987 e 1993); (b) <i>Revista Mar├¡tima Brasileira<\/i> (do fim dos anos 1970 ao presente); (c) ordens do dia de 11 de junho; acervos da DPHDM; (d) documentos internos autorizados. Os tr├¬s primeiros conjuntos s├úo p├║blicos e independem do campo.<\/td><\/tr>\n<tr><td>M├®todo<\/td><td>Norma, pr├ítica e experi├¬ncia: an├ílise documental, observa├º├úo com di├írio de campo e registro reflexivo, 10 a 16 entrevistas semiestruturadas (oficiais e pra├ºas, gera├º├Áes e fun├º├Áes diversas), cruzamento de fontes; diverg├¬ncia entre fontes tratada como dado.<\/td><\/tr>\n<tr><td>├ëtica<\/td><td>Res. CNS 510/2016; CEP via Plataforma Brasil; TCLE e termo de cess├úo; convite fora da cadeia de comando; subordinados diretos exclu├¡dos; anonimiza├º├úo desde a transcri├º├úo; nada classificado ou operacional; anu├¬ncia do comando antes do campo.<\/td><\/tr>\n<\/table>\n\n<h2>8.2 Apresenta├º├úo inicial (roteiro de 5 minutos)<\/h2>\n<ol>\n<li><b>Gancho (30 s):<\/b> a frase de Barroso como vest├¡gio, e a pergunta sobre o que ela significa hoje.<\/li>\n<li><b>Problema (1 min):<\/b> a dist├óncia entre o que a norma prescreve e o modo como a autoridade se exerce, vista historicamente.<\/li>\n<li><b>Por que ├® hist├│ria (45 s):<\/b> o passado como explica├º├úo das pr├íticas do presente; genealogia das normas e rituais; hist├│ria do tempo presente.<\/li>\n<li><b>Territ├│rio (45 s):<\/b> a hierarquia se materializa no espa├ºo; domina├º├úo e apropria├º├úo; a autoridade informal tem localiza├º├úo.<\/li>\n<li><b>Fontes e m├®todo (1 min):<\/b> tr├¬s conjuntos p├║blicos garantem a viabilidade, e o campo amplia e testa os resultados.<\/li>\n<li><b>├ëtica e posi├º├úo (45 s):<\/b> a inser├º├úo profissional ├® acesso e problema; cuidados concretos.<\/li>\n<li><b>Contribui├º├úo (15 s):<\/b> o p├│s-1988 visto por dentro e no cotidiano, numa historiografia social da Marinha concentrada no Imp├®rio e na Primeira Rep├║blica.<\/li>\n<\/ol>\n\n", "diaarg": "<h2>8.6 No dia da argui├º├úo<\/h2>\n<ul>\n<li>Leve uma c├│pia impressa do projeto, da carta e do Lattes, com marca├º├Áes discretas.<\/li>\n<li>Escute a pergunta at├® o fim. Se for longa, anote palavras-chave. Responda em 1 a 2 minutos: tese, justificativa, exemplo.<\/li>\n<li>Diante de cr├¡tica: agrade├ºa, reconhe├ºa o que ├® procedente e mostre como incorporaria (\"├® uma lacuna; eu incorporaria assim...\"). Nunca seja defensivo nem desqualifique a pergunta.<\/li>\n<li>N├úo invente: \"n├úo sei, mas buscaria em...\" ├® melhor que uma resposta errada.<\/li>\n<li>Pesquise com anteced├¬ncia os docentes da Linha 1 (p├ígina do PPGHS e Lattes) para saber quem pode compor a banca e quais temas estudam. N├úo force aproxima├º├úo artificial com eles.<\/li>\n<\/ul>\n", "tabs": [{"t": "Territ├│rio", "intro": "Na ├írea, territ├│rio ├® rela├º├úo de poder com e pelo espa├ºo (Haesbaert). Os outros textos fornecem as dimens├Áes hist├│rica, simb├│lica e pol├¡tica dessa rela├º├úo.", "rows": [["Haesbaert", "Rela├º├úo de poder; domina├º├úo (funcional) e apropria├º├úo (simb├│lica) combinadas em todo territ├│rio (pp. 20ÔÇô23); territ├│rio-zona ├ù territ├│rio-rede (pp. 28ÔÇô29); multiterritorialidade desigual (p. 41)."], ["Thompson (costume)", "Costume territorializado: troca entre \"a aldeia e a metr├│pole\" (p. 17); direitos de uso."], ["Thompson (economia moral)", "O mercado como lugar onde os pobres sentiam ter for├ºa (p. 201)."], ["Certeau", "Lugar social e institucional da pesquisa (p. 66); a pesquisa \"redistribui o espa├ºo\" (t├¡tulo da se├º├úo, p. 81)."], ["Catroga", "Monumentos, lugares de mem├│ria, cemit├®rios; espa├ºo social fixado pela mem├│ria do grupo (pp. 23ÔÇô24)."], ["Ginzburg", "Leitura do terreno pelo ca├ºador (pp. 151ÔÇô152); identifica├º├úo estatal dos indiv├¡duos (p. 177)."], ["Poulantzas", "Estado como condensa├º├úo de for├ºas, campo estrat├®gico (pp. 147, 157)."]]}, {"t": "Tempo e historicidade", "intro": "O tempo hist├│rico ├® constru├¡do (Albuquerque Jr.), estratificado (Koselleck) e disputado pela mem├│ria (Catroga).", "rows": [["Albuquerque Jr.", "Desnaturalizar o tempo, constru├º├úo social e narrativa (p. 24); dieta de temporalidades (p. 25); ucronia (p. 29)."], ["Koselleck", "Espa├ºo de experi├¬ncia e horizonte de expectativa (p. 104); simultaneidade do n├úo-simult├óneo (p. 115)."], ["Catroga", "Mem├│ria liga passado, presente e futuro; crise da mem├│ria e \"tempo real\" (pp. 32ÔÇô33)."], ["R├®mond", "O pol├¡tico articula o cont├¡nuo e o descont├¡nuo, o instant├óneo e o lento (p. 34)."], ["Hobsbawm", "Anacronismo como maior perigo (PDF p. 11)."]]}, {"t": "Mem├│ria", "intro": "A mem├│ria ├® seletiva, social e ligada ao poder; a hist├│ria a interroga sem se separar totalmente dela.", "rows": [["Catroga", "Alteridade (p. 17); sele├º├úo e esquecimento (p. 26); rela├º├úo \"indecisa\" com a historiografia (p. 44); instrumento de poder (p. 55)."], ["Hobsbawm", "Mecanismo seletivo (PDF p. 6); lembran├ºa das pessoas comuns ├ù dos superiores (PDF p. 7)."], ["Certeau", "A escrita como t├║mulo, um lugar para os vivos (p. 107)."], ["Albuquerque Jr.", "Historiografia como discurso do luto (p. 39)."]]}, {"t": "Opera├º├úo historiogr├ífica e conhecimento hist├│rico", "intro": "Como se produz o conhecimento hist├│rico: lugar, m├®todo, escrita, ind├¡cio.", "rows": [["Certeau", "Lugar, procedimentos e texto (p. 66); permiss├úo e interdi├º├úo (p. 77); fontes produzidas (p. 81)."], ["Ginzburg", "Conhecimento indireto, indici├írio, conjetural (p. 157); rigor flex├¡vel (p. 179)."], ["Koselleck", "Hist├│ria dos conceitos como cr├¡tica de fontes (p. 103)."], ["Hobsbawm", "As fontes surgem das perguntas (PDF p. 5)."], ["Catroga", "A consci├¬ncia do historiador n├úo ├® recept├ículo vazio (p. 48)."], ["R├®mond", "O historiador ├® sempre de um tempo (p. 13)."]]}, {"t": "Paradigma indici├írio", "intro": "Ginzburg ├® o n├║cleo; os demais mostram onde ler ind├¡cios.", "rows": [["Ginzburg", "Morelli, Freud, Holmes (p. 150); ca├ºador (p. 152); controle estatal (p. 177)."], ["Thompson", "A multid├úo tem objetivos que s├│ aparecem quando lidos com aten├º├úo (p. 152: no├º├úo legitimadora)."], ["Catroga", "Tra├ºo: impress├Áes deixadas pela passagem de um animal, testemunho e ind├¡cio (p. 24)."], ["Hobsbawm", "Fontes indiretas sobre as pessoas comuns (PDF p. 5)."]]}, {"t": "Conceitos e linguagem", "intro": "Palavras e conceitos registram e produzem a realidade social.", "rows": [["Koselleck", "Indicador e fator (p. 109); batalha sem├óntica (p. 102)."], ["Thompson", "\"Cultura\" ├® termo emaranhado (p. 22)."], ["Albuquerque Jr.", "Nomear e classificar como saber e poder (p. 34)."], ["Mendon├ºa & Fontes", "Cultura pol├¡tica, conceito \"deliberadamente vago\" (Novick, citado, p. 60)."]]}, {"t": "Experi├¬ncia e classe", "intro": "Classe como rela├º├úo hist├│rica vivida.", "rows": [["Thompson (costume)", "Identidades deferente e rebelde (p. 20)."], ["Thompson (economia moral)", "No├º├úo legitimadora dos pobres (p. 152)."], ["Mendon├ºa & Fontes", "Condi├º├úo ├ù posi├º├úo de classe (Bourdieu, p. 66); \"hierarquias de honra\" (p. 67)."], ["Hobsbawm", "Pessoas comuns como sujeitos (PDF p. 1)."]]}, {"t": "Poder e Estado", "intro": "Do Estado-coisa ao Estado-rela├º├úo; do poder pol├¡tico ao simb├│lico.", "rows": [["Poulantzas", "Condensa├º├úo material de uma rela├º├úo de for├ºas (p. 147); n├úo unit├írio (p. 153); micropol├¡ticas (p. 156)."], ["Mendon├ºa & Fontes", "Estado ampliado (p. 62); hegemonia ├ù viol├¬ncia simb├│lica (p. 65)."], ["R├®mond", "Autonomia do pol├¡tico (p. 23); institui├º├Áes n├úo neutras (p. 24)."], ["Haesbaert", "Poder expl├¡cito (domina├º├úo) e simb├│lico (apropria├º├úo) (pp. 20ÔÇô21)."], ["Ginzburg", "Ind├¡cios a servi├ºo do controle estatal (p. 177)."]]}, {"t": "Hist├│ria pol├¡tica", "intro": "Renova├º├úo do pol├¡tico e sua cr├¡tica marxista.", "rows": [["R├®mond", "Cr├¡tica ├á hist├│ria pol├¡tica tradicional (p. 18); ci├¬ncia-encruzilhada (p. 29); cultura pol├¡tica (p. 35)."], ["Mendon├ºa & Fontes", "Hist├│ria pol├¡tica dentro e fora do Estado restrito (p. 69); cr├¡tica ├á hist├│ria oral sem classe (p. 59)."], ["Poulantzas", "Lutas pol├¡ticas atravessam o Estado (p. 162)."]]}, {"t": "Hist├│ria vista de baixo", "intro": "Os subalternos como sujeitos da hist├│ria.", "rows": [["Hobsbawm", "Brecht (PDF p. 1); governantes precisam levar em conta os governados (PDF p. 12)."], ["Thompson", "Contra a vis├úo espasm├│dica (p. 150); economia moral (p. 152)."], ["Catroga", "Dar a palavra aos condenados ao sil├¬ncio (p. 49); hist├│ria dos oprimidos e descontinuidade (p. 50)."], ["Ginzburg", "Saberes baixos, intui├º├úo baixa (p. 179)."]]}], "vespera": "<h2>2.2 V├®spera e dia da prova<\/h2>\n<ul>\n<li><b>22/11 (dom):<\/b> descanso. No m├íximo 30 min passando os olhos nos cart├Áes. Separar documento, canetas, rel├│gio e lanche.<\/li>\n<li><b>23/11 (seg):<\/b> chegar ├á FFP com anteced├¬ncia (tr├ónsito Niter├│iÔÇôS├úo Gon├ºalo). Siga a gest├úo de tempo da se├º├úo 6.<\/li>\n<\/ul>\n\n<h2>2.3 Depois da prova: plano at├® a argui├º├úo (24/11 a 07/12)<\/h2>\n<table><tr><th>Per├¡odo<\/th><th>Tarefa<\/th><\/tr>\n<tr><td>24/11<\/td><td>Resultado da prova. Logo depois, escreva de mem├│ria o que respondeu em cada quest├úo (a banca pode perguntar sobre a prova na argui├º├úo).<\/td><\/tr>\n<tr><td>25ÔÇô28/11<\/td><td>Reler o pr├®-projeto duas vezes e marcar cada afirma├º├úo que exige justificativa. Preparar uma <b>apresenta├º├úo oral de 5 minutos<\/b> (problema, hip├│teses, fontes, m├®todo, liga├º├úo com territ├│rio e com a Linha 1).<\/td><\/tr>\n<tr><td>29/11ÔÇô01/12<\/td><td>Responder por escrito, em t├│picos, as 30 perguntas da se├º├úo 8. Fixar as respostas sobre tipo de OM e acesso (se├º├úo 8.4).<\/td><\/tr>\n<tr><td>02/12<\/td><td>Resultado do pr├®-projeto e hor├írios da argui├º├úo. Ler a lista de docentes da Linha 1 e conhecer as pesquisas de quem provavelmente vai compor a banca (Lattes e p├ígina do PPGHS).<\/td><\/tr>\n<tr><td>03ÔÇô06/12<\/td><td>Treino oral gravado (celular) e pelo menos uma <b>argui├º├úo simulada<\/b> com algu├®m fazendo as perguntas dif├¡ceis. Reler a carta e o Lattes.<\/td><\/tr>\n<tr><td>07/12<\/td><td>Divulga├º├úo final dos hor├írios (17h). Revis├úo leve. 08ÔÇô09/12: argui├º├úo.<\/td><\/tr>\n<\/table>\n<h2>2.4 L├¡ngua estrangeira (24/02/2027)<\/h2>\n<p>Se n├úo pedir isen├º├úo na inscri├º├úo, reserve, a partir de meados de dezembro, cerca de <b>3 sess├Áes de 1h por semana<\/b> para ler textos acad├¬micos de Hist├│ria no idioma escolhido, de prefer├¬ncia artigos sobre territ├│rio, hist├│ria militar ou hist├│ria social, com o mesmo tipo de dicion├írio que vai levar. Detalhes na se├º├úo 9.<\/p>\n", "escrita": "<h1>6. Como escrever a resposta dissertativa numa prova sem consulta<\/h1>\n<h2>6.1 Gest├úo das 4 horas (9hÔÇô13h)<\/h2>\n<table><tr><th>Hor├írio<\/th><th>O que fazer<\/th><\/tr>\n<tr><td>9h00ÔÇô9h15<\/td><td>Ler as duas quest├Áes obrigat├│rias e as tr├¬s quest├Áes de linha. Sublinhar os <b>verbos de comando<\/b> (discuta, compare, analise, explique) e os <b>termos-chave<\/b>. Escolher a quest├úo de linha (normalmente a da Linha 1).<\/td><\/tr>\n<tr><td>9h15ÔÇô9h35<\/td><td><b>Planejar a quest├úo da ├írea<\/b> no rascunho: tese em 1 frase, 3 ou 4 blocos de argumento com autores, conclus├úo.<\/td><\/tr>\n<tr><td>9h35ÔÇô10h55<\/td><td>Escrever a quest├úo da ├írea (Ôëê 80 min).<\/td><\/tr>\n<tr><td>10h55ÔÇô11h15<\/td><td>Planejar a quest├úo de linha.<\/td><\/tr>\n<tr><td>11h15ÔÇô12h35<\/td><td>Escrever a quest├úo de linha.<\/td><\/tr>\n<tr><td>12h35ÔÇô13h00<\/td><td>Revisar as duas: ortografia, nomes pr├│prios, frases incompletas, conclus├úo.<\/td><\/tr>\n<\/table>\n<p><b>Regra de ouro:<\/b> nunca deixe uma quest├úo sem conclus├úo. Se o tempo apertar, encurte o ├║ltimo bloco e feche.<\/p>\n\n<h2>6.2 Estrutura da resposta<\/h2>\n<ol>\n<li><b>Introdu├º├úo (5ÔÇô8 linhas):<\/b> reformule o problema com suas palavras, apresente a <b>tese<\/b> e anuncie o percurso (\"Para discutir..., examino primeiro..., depois..., por fim...\").<\/li>\n<li><b>Desenvolvimento (3ÔÇô4 blocos):<\/b> cada bloco tem uma ideia, um ou dois autores, os conceitos definidos e uma articula├º├úo expl├¡cita com a pergunta e com o <b>territ├│rio<\/b>. Use exemplos hist├│ricos dos pr├│prios textos (cercamentos, motins da fome, Morelli, Sattelzeit, Estado-na├º├úo).<\/li>\n<li><b>Di├ílogo entre autores:<\/b> pelo menos uma converg├¬ncia e uma tens├úo (veja a tabela 5.7).<\/li>\n<li><b>Conclus├úo (5ÔÇô8 linhas):<\/b> responda diretamente ├á pergunta, retome a tese e, se couber, aponte uma implica├º├úo para a pesquisa hist├│rica, com um gancho para a Linha ou para o seu objeto, sem transformar a resposta em apresenta├º├úo do projeto.<\/li>\n<\/ol>\n<h2>6.3 Como citar sem consulta<\/h2>\n<ul>\n<li>Use <b>par├ífrase atribu├¡da<\/b>: \"Para Haesbaert, o territ├│rio se estende num cont├¡nuo entre domina├º├úo e apropria├º├úo\". N├úo tente reproduzir frases entre aspas. Se lembrar s├│ de uma express├úo-conceito consagrada (por exemplo, \"paradigma indici├írio\", \"economia moral\", \"condensa├º├úo de uma rela├º├úo de for├ºas\"), ela pode ir entre aspas como <b>nome de conceito<\/b>.<\/li>\n<li>N├úo invente datas nem p├íginas. Se citar ano, use o do edital ou o da obra original, se tiver certeza (\"Thompson, em artigo de 1971...\").<\/li>\n<li>Defina cada conceito na primeira vez que o usar. A banca avalia dom├¡nio, n├úo s├│ men├º├úo.<\/li>\n<\/ul>\n<h2>6.4 Crit├®rios que a banca provavelmente usa <span class=\"inc\">ÔÜá inferidos; o edital n├úo detalha crit├®rios de corre├º├úo<\/span><\/h2>\n<ul><li>Pertin├¬ncia ├á pergunta (responder o que foi pedido)<\/li><li>Dom├¡nio da bibliografia indicada (conceitos corretos, autores certos)<\/li><li>Capacidade de articula├º├úo entre autores e com o tema do territ├│rio<\/li><li>Argumenta├º├úo: tese clara, progress├úo l├│gica<\/li><li>Corre├º├úo e clareza da l├¡ngua escrita<\/li><\/ul>\n<h2>6.5 Erros comuns<\/h2>\n<ul><li>\"Fichamento em sequ├¬ncia\" (um par├ígrafo por autor, sem di├ílogo).<\/li><li>Falar do pr├│prio projeto em vez de responder ├á quest├úo.<\/li><li>Usar \"territ├│rio\" como sin├┤nimo de lugar ou de espa├ºo f├¡sico.<\/li><li>Generalidades sem conceito (\"a hist├│ria ├® muito importante...\").<\/li><li>Letra ileg├¡vel e aus├¬ncia de par├ígrafos. Treine escrever ├á m├úo: nos simulados, conte as p├íginas que produz em 80 minutos.<\/li><\/ul>\n<h2>6.6 Banco de conectivos e frases de transi├º├úo<\/h2>\n<p class=\"small\">\"Essa perspectiva permite...\", \"Em dire├º├úo semelhante, embora com ├¬nfase distinta...\", \"├ë precisamente nesse ponto que...\", \"Tal leitura, contudo, encontra limites quando...\", \"Se, para X, ..., para Y...\", \"Da├¡ decorre que...\", \"Em s├¡ntese,...\". Na conclus├úo: \"Retomando a quest├úo proposta,...\"<\/p>\n"}</script>

// ---------- schedule
function sched() { return D.sched.map((x, i) => ({...x, i, d: S.moved[i] || x.d})); }
function dayState(i) { return S.days[i] || ''; }
function lateTasks() { const t = today(); return sched().filter(x => x.d < t && !dayState(x.i)); }
function suggestions() {
  const late = lateTasks();
  if (!late.length) return [];
  const t = today();
  const fut = sched().filter(x => x.d >= t && x.d <= '2026-11-19');
  const load = {};
  fut.forEach(x => load[x.d] = (load[x.d] || 0) + x.h);
  const days = [...new Set(fut.map(x => x.d))];
  const out = [];
  late.forEach(l => {
    if (!days.length) return;
    days.sort((a, b) => (load[a] - load[b]) || a.localeCompare(b));
    const d = days[0];
    load[d] += l.h;
    out.push([l, d]);
  });
  return out;
}
function streak() {
  const set = new Set(S.log.filter(l => l.m > 0).map(l => l.d));
  sched().forEach(x => { if (S.days[x.i] === 'done') set.add(S.days[x.i + '_at'] || x.d); });
  let n = 0, d = new Date();
  if (!set.has(iso(d))) d.setDate(d.getDate() - 1);
  while (set.has(iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- flashcards
function buildCards() {
  const c = [];
  TX.forEach(t => {
    const a = short(t);
    t.conceitos.forEach((k, j) => c.push({id: t.id + '_c' + j, t: t.id, f: `<span class="mu">${a} ┬À CONCEITO</span><br><b>${k[0]}</b>`, b: k[1]}));
    t.cit.forEach((k, j) => c.push({id: t.id + '_q' + j, t: t.id, f: `<span class="mu">QUEM DISSE E EM QUE CONTEXTO?</span><br>┬½${k[1]}┬╗`, b: `<b>${a}</b>, ${String(k[0]).match(/PDF/) ? k[0] : 'p. ' + k[0]}. ${k[2] || ''}`, p: k[0]}));
    t.ex_comp.forEach((k, j) => c.push({id: t.id + '_e' + j, t: t.id, f: `<span class="mu">${a} ┬À EXERC├ìCIO</span><br>${k[0]}`, b: k[1]}));
  });
  return c;
}
const CARDS = buildCards();
function cst(id) { return S.cards[id] || {ef: 2.5, n: 0, iv: 0, due: ''}; }
function grade(id, q) {
  const c = cst(id);
  if (q < 3) { c.n = 0; c.iv = 1; }
  else { c.n++; c.iv = c.n == 1 ? 1 : c.n == 2 ? 3 : Math.round(c.iv * c.ef); }
  c.ef = Math.max(1.3, c.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  const d = new Date();
  d.setDate(d.getDate() + c.iv);
  c.due = iso(d);
  S.cards[id] = c;
  save();
}
function queue() {
  const t = today();
  const due = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= t);
  const prioOrd = {ESSENCIAL: 0, IMPORTANTE: 1, 'SECUND├üRIO': 2};
  const nw = CARDS.filter(c => !S.cards[c.id] && (S.texts[c.t] || '') !== '').sort((a, b) => prioOrd[TXI[a.t].prio] - prioOrd[TXI[b.t].prio]);
  const lim = +(S.newPerDay || 15);
  const doneNew = Object.values(S.cards).filter(c => c.first === t).length;
  return due.concat(nw.slice(0, Math.max(0, lim - doneNew)));
}

  ['pw', 'pb', 'pl'].forEach((k, i) => $('#' + k).onchange = e => { S.pomo[['w', 'b', 'lb'][i]] = +e.target.value; save(); if (!P.run) { P.left = S.pomo[P.mode === 'w' ? 'w' : P.mode] * 60; tick(); } });

function logm(m) { if (m > 0) { S.log.push({d: today(), t: S.pomoT || '', m: Math.round(m * 10) / 10}); save(); } }
function flush() { if (P.mode === 'w' && P.run) { P.acc += (Date.now() - P.start) / 6e4; P.start = Date.now(); } if (P.acc >= 0.5) logm(P.acc); P.acc = 0; }
function startP() { P.run = true; P.start = Date.now(); P.tid = setInterval(() => { P.left--; if (P.left <= 0) { flush(); beep(); nextPhase(); } if (cur === 'pomo') tick(); }, 1000); }
function pause() { if (P.run && P.mode === 'w') P.acc += (Date.now() - P.start) / 6e4; P.run = false; clearInterval(P.tid); flush(); }
function nextPhase() { if (P.mode === 'w') { P.n++; P.mode = P.n % 4 ? 'b' : 'lb'; } else P.mode = 'w'; P.left = S.pomo[P.mode === 'w' ? 'w' : P.mode] * 60; if (P.run) P.start = Date.now(); if (cur === 'pomo') V.pomo(); }
function tick() { const e = $('#tm'); if (!e) return; e.textContent = String(Math.floor(P.left / 60)).padStart(2, '0') + ':' + String(P.left % 60).padStart(2, '0'); $('#pm').textContent = (P.mode === 'w' ? 'MODO FOCO' : 'MODO PAUSA') + ' ┬À BLOCOS CONCLU├ìDOS: ' + P.n; }
function beep() { try { const a = new AudioContext(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 400); } catch (e) {} }
function charts() {

V.mapa = () => {
  const W = Math.min(1100, innerWidth - 80), H = 540, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 75;
  const pos = TX.map((t, i) => { const a = i / TX.length * 2 * Math.PI - Math.PI / 2; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const find = n => TX.filter(t => n.split(/\s*[\/,]\s*|\s+e\s+/).some(p => { p = p.toLowerCase(); return p.length > 3 && (short(t).toLowerCase().includes(p) || t.autor.toLowerCase().includes(p.replace('&', '').trim())) || (p.includes('mendon') && t.id === 'mendonca'); })).map(t => t.id);
  const E2 = [];
  TX.forEach(t => t.conexoes.forEach(k => find(k[0]).forEach(o => { if (o !== t.id) E2.push([t.id, o, k[0], k[1]]); })));
  const ix = Object.fromEntries(TX.map((t, i) => [t.id, i]));
  $('#app').innerHTML = `<div class="card"><h3>Mapa Construtivista de Conex├Áes</h3><p class="mu">Arestas tiradas das "conex├Áes" de cada ficha. Clique num autor para destacar as liga├º├Áes te├│ricas e ler as justificativas.</p><div style="overflow-x:auto"><svg id="g" width="${W}" height="${H}"></svg></div><div id="gi"></div></div>` + D.tabs.map(t => `<div class="card"><details><summary>Quadro Comparativo: ${t.t}</summary><p>${t.intro}</p><table>${t.rows.map(r => `<tr><td style="width:22%"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</table></details></div>`).join('');

function processProfileAvatar(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;

      ctx.drawImage(img, sx, sy, side, side, 0, 0, 160, 160);

      let dataUrl = canvas.toDataURL('image/webp', 0.8);
      if (!dataUrl.startsWith('data:image/webp')) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      }
      callback(null, dataUrl);
    };
    img.onerror = () => callback(new Error('Erro ao carregar imagem'));
    img.src = e.target.result;
  };
  reader.onerror = () => callback(new Error('Erro ao ler arquivo'));
  reader.readAsDataURL(file);
}

function updateThemeUI() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const btn = $('#theme');
  if (btn) btn.textContent = isDark ? '[ Ôùæ NOITE ]' : '[ ÔùÉ DIA ]';
  document.body.classList.toggle('hc', isDark);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  if (next === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  try {
    localStorage.setItem('crivos_theme', next);
    localStorage.setItem('crivos_web_theme', next);
    S.theme = next === 'dark' ? 'hc' : '';
    save();
  } catch (e) {}
  updateThemeUI();
}

$('#theme').onclick = toggleTheme;
