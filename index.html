<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRIVOS // Sistemas de Estudo Sob Demanda</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23D92B2B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function() {
  try {
    var t = localStorage.getItem('crivos_theme') || localStorage.getItem('crivos_web_theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch(e) {}
})();
</script>
<style>
:root {
  --bg-paper: #F4F4F0;
  --bg-card: #FFFFFF;
  --bg-subtle: #EAEAE4;
  --bg-dark: #111111;
  --ink-primary: #111111;
  --ink-muted: #555555;
  --border-color: #111111;
  --border-subtle: #D4D4CC;
  --crivos-red: #D92B2B;
  --crivos-blue: #1D4ED8;
  --crivos-yellow: #F5B700;
  --shadow-hard: 2px 2px 0px #111111;
  --shadow-hard-lg: 4px 4px 0px #111111;
  --nav-bg: rgba(244, 244, 240, 0.98);

  /* Aliases para compatibilidade total com regras existentes */
  --bg: var(--bg-paper);
  --s1: var(--bg-card);
  --card: var(--bg-card);
  --s2: var(--bg-subtle);
  --tx: var(--ink-primary);
  --mu: var(--ink-muted);
  --bd: var(--border-color);
  --red: var(--crivos-red);
  --blue: var(--crivos-blue);
  --yellow: var(--crivos-yellow);
  --ac: var(--crivos-red);
  --ok: #15803D;
  --wa: #D97706;
  --er: var(--crivos-red);
  --sh: var(--shadow-hard-lg);
  --sh-sm: var(--shadow-hard);
  --bw: 1px;
}

[data-theme="dark"] {
  --bg-paper: #0D0D0D;
  --bg-card: #161616;
  --bg-subtle: #222222;
  --bg-dark: #050505;
  --ink-primary: #F0F0EC;
  --ink-muted: #999992;
  --border-color: #333333;
  --border-subtle: #262626;
  --crivos-red: #E53935;
  --crivos-blue: #3B82F6;
  --crivos-yellow: #FACC15;
  --shadow-hard: 2px 2px 0px #000000;
  --shadow-hard-lg: 4px 4px 0px #000000;
  --nav-bg: rgba(13, 13, 13, 0.98);

  /* Aliases Dark Mode */
  --bg: var(--bg-paper);
  --s1: var(--bg-card);
  --card: var(--bg-card);
  --s2: var(--bg-subtle);
  --tx: var(--ink-primary);
  --mu: var(--ink-muted);
  --bd: var(--border-color);
  --red: var(--crivos-red);
  --blue: var(--crivos-blue);
  --yellow: var(--crivos-yellow);
  --ac: var(--crivos-red);
  --ok: #22C55E;
  --wa: #F59E0B;
  --er: var(--crivos-red);
  --sh: var(--shadow-hard-lg);
  --sh-sm: var(--shadow-hard);
}

/* Fallback para classe legada hc caso seja acionada */
body.hc {
  --bg-paper: #0D0D0D;
  --bg-card: #161616;
  --bg-subtle: #222222;
  --ink-primary: #F0F0EC;
  --ink-muted: #999992;
  --border-color: #333333;
  --border-subtle: #262626;
  --crivos-red: #E53935;
  --shadow-hard: 2px 2px 0px #000000;
  --shadow-hard-lg: 4px 4px 0px #000000;
}

* {
  box-sizing: border-box;
  border-radius: 0px !important;
}

html {
  background: var(--bg-paper);
  scroll-behavior: smooth;
  color-scheme: light;
}
[data-theme="dark"] {
  color-scheme: dark;
}

body {
  margin: 0;
  font: 14px/1.6 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg-paper);
  color: var(--ink-primary);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

::selection {
  background: var(--crivos-red);
  color: #FFFFFF;
}

/* TOPBAR INSTITUCIONAL CRIVOS (ID├èNTICA ├Ç DO CRIVOS-WEB) */
.crivos-topbar {
  background: var(--bg-dark);
  color: #F4F4F0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  padding: 6px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  letter-spacing: 0.05em;
  gap: 12px;
  z-index: 40;
  flex-wrap: nowrap;
}
.crivos-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.crivos-topbar-left .sq-red {
  color: var(--crivos-red);
  font-size: 12px;
  display: inline-block;
}
.crivos-topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #A3A39E;
  flex-shrink: 0;
  white-space: nowrap;
}
.theme-toggle-btn {
  background: #1E1E1E;
  color: #FFFFFF;
  border: 1px solid #555555;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
  white-space: nowrap;
  line-height: 1.4;
  height: 24px;
  box-sizing: border-box;
}
.theme-toggle-btn:hover {
  background: #FFFFFF;
  color: #111111;
  border-color: #FFFFFF;
}
[data-theme="dark"] .theme-toggle-btn {
  background: #161616;
  color: #F0F0EC;
  border-color: #444444;
}
[data-theme="dark"] .theme-toggle-btn:hover {
  background: #F0F0EC;
  color: #0D0D0D;
  border-color: #F0F0EC;
}
.crivos-topbar-user {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: #FFFFFF;
  text-decoration: none;
  padding: 2px 8px;
  background: #1E1E1E;
  border: 1px solid #444444;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  transition: all 0.15s ease;
  white-space: nowrap;
  line-height: 1.4;
  height: 24px;
  box-sizing: border-box;
}
.crivos-topbar-user:hover {
  background: #2E2E2E;
  color: #FFFFFF;
  border-color: #777777;
}
[data-theme="dark"] .crivos-topbar-user {
  background: #161616;
  color: #F0F0EC;
  border-color: #333333;
}
[data-theme="dark"] .crivos-topbar-user:hover {
  background: #242424;
  color: #FFFFFF;
  border-color: #555555;
}
.crivos-mini-avatar {
  width: 16px;
  height: 16px;
  background: #222222;
  color: #FFFFFF;
  border: 1px solid #444444;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 8.5px;
  font-weight: 800;
  overflow: hidden;
  text-transform: uppercase;
  flex-shrink: 0;
}
.crivos-mini-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* BLOCO DE IDENTIFICA├ç├âO DO PLANO (GRADE T├ëCNICA E BRAND CRIVOS) */
header.crivos-header {
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 45;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  min-height: 56px;
}

.crivos-plan-block {
  display: flex;
  align-items: center;
  padding: 8px 20px;
  flex: 1;
  min-width: 0;
}
.crivos-plan-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  overflow: hidden;
}
.crivos-brand-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
  overflow: hidden;
}
.nav-brand-logo {
  width: 12px;
  height: 12px;
  background: var(--crivos-red);
  border: 1px solid var(--border-color);
  flex-shrink: 0;
}
.crivos-brand-title {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  color: var(--ink-primary);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-brand-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 1px 5px;
  color: var(--ink-primary);
  display: inline-block;
  white-space: nowrap;
}
.crivos-plan-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


.crivos-header-countdown {
  display: flex;
  align-items: center;
  margin-left: auto;
  border-left: 1px solid var(--border-color);
  padding: 0 16px;
  gap: 12px;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-card);
  flex-shrink: 0;
}
.countdown-item {
  display: flex;
  flex-direction: column;
  text-align: right;
  min-width: 60px;
}
.countdown-item .cd-label {
  font-size: 9px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.countdown-item .cd-val {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-primary);
  letter-spacing: -0.02em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--bg-subtle);
  border-left: 1px solid var(--border-color);
  flex-shrink: 0;
}
.header-actions .mobile-menu-btn {
  display: none;
}

/* NAVEGA├ç├âO */
nav {
  display: flex;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: thin;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 64px;
  z-index: 35;
  padding: 0 24px;
  -webkit-overflow-scrolling: touch;
}
nav::-webkit-scrollbar {
  height: 4px;
}
nav::-webkit-scrollbar-track {
  background: var(--bg-subtle);
}
nav::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
}

nav button {
  border: none;
  border-right: 1px solid var(--border-color);
  background: transparent;
  color: var(--ink-primary);
  padding: 11px 16px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: background-color 0.12s ease, color 0.12s ease;
  position: relative;
}

nav button:first-child {
  border-left: 1px solid var(--border-color);
}

nav button:hover {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}

nav button.on {
  background: #111111;
  color: #FFFFFF !important;
}

[data-theme="dark"] nav button.on {
  background: #262626;
  color: #FFFFFF !important;
}

nav button.on::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--crivos-red);
}

/* BOT├òES BRUTALISTAS */
.btn {
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--ink-primary);
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: background-color 0.12s ease, color 0.12s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: var(--shadow-hard);
}

.btn:hover {
  background: var(--ink-primary);
  color: var(--bg-paper);
}

.btn:active {
  transform: translate(1px, 1px);
  box-shadow: none;
}

.btn.p {
  background: var(--crivos-red);
  color: #FFFFFF;
  border-color: var(--border-color);
}

.btn.p:hover {
  background: #B71C1C;
  color: #FFFFFF;
}

.btn.s {
  padding: 5px 10px;
  font-size: 11px;
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--crivos-red);
  outline-offset: 1px;
}

main {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 64px;
  flex: 1;
}

.grid {
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  margin-bottom: 24px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  padding: 24px;
  margin-bottom: 24px;
  position: relative;
}

.card .card {
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  box-shadow: none;
  margin-top: 14px;
}

.card h3, h2 {
  margin: 0 0 14px;
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1 {
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.03em;
  text-transform: uppercase;
}

.big {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
  color: var(--ink-primary);
  margin: 8px 0;
}

.mu {
  color: var(--ink-muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border: 1px solid var(--border-color);
  color: var(--ink-primary);
  background: var(--bg-subtle);
  margin-right: 4px;
}

.tag.ar {
  background: #111111;
  color: #FFFFFF;
  border-color: #111111;
}
[data-theme="dark"] .tag.ar {
  background: #2A2A2A;
  color: #F0F0EC !important;
  border-color: #666666;
}
.tag.li, .tag.l1 {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}
.tag.rev {
  background: transparent;
  color: var(--crivos-blue);
  border-color: var(--crivos-blue);
}
.tag.esc {
  background: var(--crivos-red);
  color: #FFFFFF;
  border-color: var(--crivos-red);
}
.tag.sim {
  background: #111111;
  color: var(--crivos-yellow);
  border-color: var(--border-color);
}
.tag.adm {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}

.prio {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border: 1px solid var(--border-color);
  text-transform: uppercase;
}
.ESSENCIAL {
  background: var(--crivos-red);
  color: #FFFFFF;
}
.IMPORTANTE {
  background: var(--crivos-yellow);
  color: #111111;
}
.SECUND├üRIO {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}

.bar {
  height: 12px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  overflow: hidden;
  margin: 10px 0;
  position: relative;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--crivos-red);
}

table {
  border-collapse: collapse;
  width: 100%;
  border: 1px solid var(--border-color);
  margin: 14px 0;
  background: var(--bg-card);
}
td, th {
  border: 1px solid var(--border-color);
  padding: 10px 12px;
  text-align: left;
  vertical-align: top;
  font-size: 13px;
}
th {
  background: var(--bg-subtle);
  color: var(--ink-primary);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
tr:hover td {
  background: var(--bg-subtle);
}

.day.done {
  opacity: 0.45;
  background: var(--bg-subtle);
}
.day.skip {
  opacity: 0.4;
  text-decoration: line-through;
}
.day.today td {
  background: var(--bg-subtle);
}
.day.today td:first-child {
  border-left: 4px solid var(--ink-primary);
  font-weight: 700;
}
.day.late td:first-child {
  border-left: 4px solid var(--crivos-red);
  color: var(--crivos-red);
  font-weight: 700;
}

textarea, input, select {
  font: inherit;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-primary);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 8px 10px;
}
textarea {
  font-family: 'Inter', sans-serif;
  width: 100%;
  line-height: 1.6;
  padding: 12px;
  font-size: 14px;
  resize: vertical;
  margin-top: 6px;
}
textarea:focus, input:focus, select:focus {
  background: var(--bg-card);
  border-color: var(--crivos-red);
  outline: none;
}

details {
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  padding: 10px 14px;
  margin-bottom: 8px;
}
details[open] {
  background: var(--bg-card);
}
details summary {
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 13px;
}
details summary:hover {
  color: var(--crivos-red);
}

.fc {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  font-size: 20px;
  line-height: 1.5;
  padding: 36px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-hard);
}
.fc hr {
  border: 0;
  border-top: 2px solid var(--crivos-red);
  width: 80px;
  margin: 20px auto;
}

.timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 72px;
  font-weight: 700;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--ink-primary);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-hard);
  padding: 16px 28px;
  margin: 20px auto;
  max-width: 400px;
}

.hide {
  display: none !important;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
a {
  color: var(--crivos-blue);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
}
a:hover {
  color: var(--crivos-red);
}
a.btn {
  text-decoration: none;
  color: var(--ink-primary);
}
svg text {
  fill: var(--ink-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
}
b, strong {
  font-weight: 700;
}
hr {
  border: 0;
  border-top: 1px solid var(--border-color);
}
.inc {
  background: var(--crivos-yellow);
  color: #111111;
  padding: 2px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: 4px 4px 0px var(--crivos-red);
  max-width: 460px;
  width: 100%;
  padding: 24px;
}
.modal-box h4 {

 dele.", "contexto": "Ge├│grafo da UFF, Haesbaert retoma aqui a proposta de <i>O mito da desterritorializa├º├úo<\/i> (2004). O artigo responde aos discursos sobre o \"fim dos territ├│rios\" na globaliza├º├úo e sistematiza os conceitos de territ├│rio, territorialidade, \"m├║ltiplos territ├│rios\" e multiterritorialidade.", "tese": "N├úo vivemos uma desterritorializa├º├úo generalizada, e sim uma (re)territorializa├º├úo mais complexa e m├║ltipla. Todo territ├│rio combina, em propor├º├Áes vari├íveis, domina├º├úo (funcional, pol├¡tico-econ├┤mica) e apropria├º├úo (simb├│lica, vivida); por isso o territ├│rio ├® sempre rela├º├úo de poder com e pelo espa├ºo, e os sujeitos podem viver v├írios territ├│rios ao mesmo tempo, de forma desigual conforme sua posi├º├úo social.", "conceitos": [["Territ├│rio (dupla conota├º├úo)", "Etimologia entre <i>terra-territorium<\/i> e <i>terreo-territor<\/i> (terror): domina├º├úo jur├¡dico-pol├¡tica da terra e, para quem a usufrui, identifica├º├úo e apropria├º├úo (p. 20)."], ["Domina├º├úo ├ù apropria├º├úo", "Retomada de Lefebvre: apropria├º├úo ├® mais simb├│lica, ligada ao vivido e ao valor de uso; domina├º├úo ├® mais concreta, funcional, ligada ao valor de troca (p. 21)."], ["Funcional e simb├│lico", "Dois \"tipos ideais\" que nunca aparecem em estado puro: todo territ├│rio funcional tem carga simb├│lica e vice-versa (p. 23)."], ["Territorialidade", "Com Sack, a territorialidade ├® componente do poder e estrat├®gia para criar o contexto geogr├ífico pelo qual experimentamos o mundo e lhe damos significado (p. 22)."], ["Territ├│rio-zona ├ù territ├│rio-rede", "L├│gica estatal de controle de ├íreas cont├¡nuas ├ù l├│gica reticular de controle de fluxos e redes (pp. 28ÔÇô29)."], ["Multiterritorialidade", "Viv├¬ncia simult├ónea ou sucessiva de v├írios territ├│rios; \"sempre vivemos uma multiterritorialidade\" (p. 34), mas hoje ela se intensifica e ├® acess├¡vel de modo desigual (p. 41)."], ["Des-re-territorializa├º├úo", "Com Deleuze e Guattari: n├úo h├í desterritorializa├º├úo sem reterritorializa├º├úo (p. 20); quem de fato perde controle e seguran├ºa sobre os territ├│rios s├úo os mais destitu├¡dos."]], "estrutura": ["pp. 19ÔÇô20: problema (discurso da desterritorializa├º├úo) e ep├¡grafe de Deleuze e Guattari; tese da multiterritorialidade.", "pp. 20ÔÇô23: conceito de territ├│rio (etimologia; poder expl├¡cito e simb├│lico; Lefebvre; Sack; Raffestin; funcional ├ù simb├│lico; recurso ├ù abrigo em Milton Santos).", "pp. 24ÔÇô29: territ├│rios de domin├óncia funcional e simb├│lica; quatro \"fins\" da territorializa├º├úo (abrigo/recurso, identifica├º├úo, controle de acesso, controle de fluxos); territ├│rios-zona e territ├│rios-rede.", "pp. 30ÔÇô34: \"m├║ltiplos territ├│rios\" e modalidades de territorializa├º├úo (inclusive os \"territ├│rios de exce├º├úo\", com Agamben); a multiterritorialidade n├úo ├® novidade.", "pp. 35ÔÇô41: escala, espacialidade diferencial (Lacoste), compress├úo tempo-espa├ºo (Harvey, Massey); multiterritorialidade zonal ├ù reticular.", "pp. 41ÔÇô43: \"(n├úo) concluindo\": implica├º├Áes pol├¡ticas, multiterritorialidade potencial ├ù efetiva, desigualdade de acesso, cr├¡tica ao discurso da desterritorializa├º├úo como legitima├º├úo do capital financeiro."], "cit": [["20", "n├úo h├í desterritorializa├º├úo sem reterritorializa├º├úo", "F├│rmula s├¡ntese do argumento contra o \"fim dos territ├│rios\"."], ["20", "Territ├│rio, assim, em qualquer acep├º├úo, tem a ver com poder, mas n├úo apenas ao tradicional \"poder pol├¡tico\".", "Defini├º├úo-chave para a prova: territ├│rio = rela├º├úo de poder, inclusive simb├│lico."], ["21", "Lefebvre distingue apropria├º├úo de domina├º├úo", "Origem do par conceitual."], ["22", "A territorialidade, como um componente do poder, n├úo ├® apenas um meio para criar e manter a ordem", "Cita├º├úo de Sack (1986) usada por Haesbaert."], ["23", "todo territ├│rio ├®, ao mesmo tempo e obrigatoriamente, em diferentes combina├º├Áes, funcional e simb├│lico", "A frase mais ├║til do texto."], ["23", "\"n├úo diz respeito apenas ├á fun├º├úo ou ao ter, mas ao ser\"", "Bonnemaison e Cambr├¿zy, citados: o territ├│rio dos subalternizados como identidade."], ["34", "sempre vivemos uma multiterritorialidade", "A multiterritorialidade n├úo ├® inven├º├úo da globaliza├º├úo."], ["41", "encontrase acess├¡vel apenas a uma minoria", "Desigualdade de acesso ├á multiterritorialidade (o arquivo traz \"encontrase\", sem h├¡fen)."]], "territorio": "├ë a matriz da ├írea: territ├│rio como rela├º├úo social de poder, com polos de domina├º├úo e apropria├º├úo, em m├║ltiplas escalas. Permite ler institui├º├Áes, cidades, quart├®is, aldeias, mercados e redes como territ├│rios.", "conexoes": [["Thompson", "o mercado e a aldeia como territ├│rios de costume; a multid├úo reapropria o espa├ºo do mercado (economia moral)."], ["Certeau", "o \"lugar social\" da produ├º├úo historiogr├ífica ├® tamb├®m um territ├│rio institucional."], ["Poulantzas / Mendon├ºa & Fontes", "o Estado como rela├º├úo: territ├│rio-zona estatal como condensa├º├úo de rela├º├Áes de for├ºa."], ["Catroga / Albuquerque Jr.", "lugares de mem├│ria e narrativas como produ├º├úo simb├│lica (apropria├º├úo) do espa├ºo."]], "projeto": {"uso": "Base da se├º├úo 3.2 do pr├®-projeto. A OM ├® territ├│rio pr├│ximo do polo da domina├º├úo (acesso controlado, c├¡rculos hier├írquicos), mas apropriado pelos militares (setores t├®cnicos, espa├ºos de conv├¡vio). A multiterritorialidade, em escala institucional, descreve o militar que transita entre OM, c├¡rculo hier├írquico, especialidade e grupo de trabalho.", "cits": [["23", "todo territ├│rio ├®, ao mesmo tempo e obrigatoriamente, em diferentes combina├º├Áes, funcional e simb├│lico"], ["20", "Territ├│rio, assim, em qualquer acep├º├úo, tem a ver com poder"]], "prova": "Abra a resposta da ├írea com a defini├º├úo relacional de territ├│rio (pp. 20ÔÇô23) e aplique-a ao objeto da quest├úo.", "arg": "Se perguntarem \"por que territ├│rio, se o seu objeto ├® hierarquia?\": porque a hierarquia se exerce com e pelo espa├ºo (c├¡rculos, preced├¬ncias, acessos), e a apropria├º├úo informal desse espa├ºo ├® onde a autoridade informal aparece. Cuidado: voc├¬ usa Haesbaert (2004; 2007) adaptando a escala; diga isso explicitamente."}, "ex_comp": [["Por que Haesbaert recusa a tese da desterritorializa├º├úo generalizada?", "Porque todo processo de desterritorializa├º├úo vem acompanhado de reterritorializa├º├úo (p. 20); o que ocorre ├® uma territorializa├º├úo mais m├║ltipla e complexa. Al├®m disso, quem perde controle sobre o territ├│rio s├úo sobretudo os mais destitu├¡dos, e o discurso do \"fim dos territ├│rios\" legitima a fluidez do capital financeiro (p. 42)."], ["Explique a rela├º├úo entre domina├º├úo e apropria├º├úo.", "Par retomado de Lefebvre (p. 21): domina├º├úo ├® concreta, funcional, ligada ao valor de troca; apropria├º├úo ├® simb├│lica, vivida, ligada ao valor de uso. Todo territ├│rio combina as duas em propor├º├Áes vari├íveis (p. 23)."], ["O que diferencia territ├│rio-zona de territ├│rio-rede?", "O primeiro ├® t├¡pico da l├│gica estatal de controle de ├íreas cont├¡nuas com fronteiras definidas; o segundo, da l├│gica empresarial de controle de fluxos e conex├Áes (pp. 28ÔÇô29)."]], "ex_diss": ["\"Todo territ├│rio ├® funcional e simb├│lico.\" Discuta essa afirma├º├úo de Haesbaert e mostre como ela permite articular territ├│rio e rela├º├Áes de poder em uma pesquisa hist├│rica.", ["Introdu├º├úo: territ├│rio como rela├º├úo de poder, n├úo como palco (p. 20).", "Domina├º├úo ├ù apropria├º├úo (Lefebvre, p. 21); funcional ├ù simb├│lico como tipos ideais (p. 23).", "Multiterritorialidade e desigualdade de acesso (pp. 34, 41).", "Aplica├º├úo hist├│rica: Thompson (mercado como territ├│rio da economia moral) ou Poulantzas (Estado como condensa├º├úo de rela├º├Áes de for├ºa).", "Conclus├úo: territ├│rio como categoria hist├│rica, produzida e disputada."]], "off": -18}, {"id": "thompson_cc", "sec": "area", "prio": "ESSENCIAL", "ordem": 2, "autor": "E. P. Thompson", "titulo": "\"Introdu├º├úo: costume e cultura\"", "ref": "THOMPSON, E. P. Introdu├º├úo: costume e cultura. In: <i>Costumes em comum<\/i>: estudos sobre a cultura popular tradicional. S├úo Paulo: Companhia das Letras, 2013. p. 13-24.", "arq": "THOMPSON_Edward-Palmer_2013_Costume-e-cultura.pdf", "faixa": "pp. 13ÔÇô24 (completo; camada de texto OCR com pequenos erros de pontua├º├úo)", "porque": "Texto curto, fundador e articul├ível com quase todos os outros (cultura, costume, poder, experi├¬ncia). Tamb├®m abre o Thompson da Linha 1.", "contexto": "Historiador marxista brit├ónico, autor de <i>A forma├º├úo da classe oper├íria inglesa<\/i> (1963). A introdu├º├úo de <i>Costumes em comum<\/i> (1991) apresenta o programa do livro: estudar a cultura plebeia do s├®culo XVIII ingl├¬s, o costume e sua rela├º├úo com o mercado e com a gentry.", "tese": "O costume do s├®culo XVIII n├úo ├® sobreviv├¬ncia inerte do passado, mas campo de mudan├ºa e de disputa: ret├│rica de legitima├º├úo de usos e direitos, ambiente (<i>mentalit├®<\/i>) em que a plebe defende interesses diante da economia de mercado. Da├¡ o paradoxo de uma cultura tradicional que ├®, ao mesmo tempo, rebelde. A pr├│pria no├º├úo de \"cultura\" deve ser usada com cuidado, pois tende a ocultar conflitos e rela├º├Áes de poder.", "conceitos": [["Costume como ambi├¬ncia", "N├úo algo \"posterior a\" (sobreviv├¬ncia), mas <i>sui generis<\/i>: ambi├¬ncia, <i>mentalit├®<\/i>, vocabul├írio de discurso, legitima├º├úo e expectativa (p. 14)."], ["Costume como legitima├º├úo", "Ret├│rica que legitima quase todo uso, pr├ítica ou direito reclamado (p. 16)."], ["Cultura como arena", "Conjunto de recursos em troca permanente entre escrito e oral, dominante e subordinado, a aldeia e a metropole; cuidado com o termo \"cultura\", \"emaranhado\" (pp. 17, 22)."], ["Paternalismo e defer├¬ncia", "Ritos que mascaram rela├º├Áes de poder (p. 17); identidades alternadas, deferente e rebelde (p. 20)."], ["Cultura tradicional rebelde", "Paradoxo do s├®culo: a plebe resiste ├á racionaliza├º├úo econ├┤mica em nome do costume (p. 19)."], ["Economia moral ├ù economia de mercado", "Eixo da hist├│ria social do s├®culo XVIII (p. 21), que liga a introdu├º├úo ao cap├¡tulo da Linha 1."]], "estrutura": ["pp. 13ÔÇô14: apresenta├º├úo do livro; o costume como chave; cr├¡tica ├á ideia de \"sobreviv├¬ncia\" folcl├│rica.", "pp. 15ÔÇô17: costume como lei e como pr├ítica (direitos comunais, usos); cultura como arena de conflito; paternalismo e defer├¬ncia.", "pp. 18ÔÇô20: a cultura plebeia diante do mercado e do Estado; paradoxo da cultura tradicional rebelde; identidades alternadas.", "pp. 21ÔÇô24: economia moral ├ù economia de mercado; ressalvas sobre \"cultura\" (Sider: os costumes realizam algo); programa dos cap├¡tulos."], "cit": [["14", "o costume n├úo como posterior a algo, mas como sui generis", "Contra a leitura do costume como res├¡duo."], ["16", "o costume constitu├¡a a ret├│rica de legitima├º├úo de quase todo uso", "O costume como linguagem de direitos."], ["17", "uma cultura ├® tamb├®m um conjunto de diferentes recursos, em que h├í sempre uma troca entre o escrito e o oral, o dominante e o subordinado, a aldeia e a metr├│pole", "Cultura como arena, n├úo consenso."], ["17", "rela├º├Áes de poder mascaradas pelos ritos do paternalismo e da defer├¬ncia", "├Ütil para pensar hierarquias rituais."], ["19", "uma cultura tradicional que ├®, ao mesmo tempo, rebelde", "O paradoxo central."], ["20", "├ë poss├¡vel perceber no mesmo indiv├¡duo identidades que se alternam, uma deferente, a outra rebelde.", "Ambival├¬ncia dos sujeitos subordinados."], ["21", "podemos entender boa parte da hist├│ria social do s├®culo xvm como uma s├®rie de confrontos entre uma economia de mercado inovadora e a economia moral da plebe, baseada no costume", "O arquivo traz \"xvm\" (OCR de XVIII)."], ["22", "Os costumes realizam algo", "Sider, citado: o costume como pr├ítica que produz efeitos."]], "territorio": "O costume ├® territorializado: direitos comunais, us a multid├úo de micropol├¡ticas diversificadas", "Micropol├¡ticas."], ["157", "entend├¬-lo como um campo e um processo estrat├®gicos", "Campo estrat├®gico."], ["162", "as lutas populares atravessam o Estado de lado a lado", "Lutas."], ["174", "n├úo se consegue estar imune ao poder pelo simples fato de ficar fora do Estado", "Cr├¡tica a Foucault."]], "territorio": "O Estado-na├º├úo organiza o territ├│rio (espa├ºo serial, fronteiras); a condensa├º├úo de for├ºas tem express├úo espacial. O texto completa a leitura do territ├│rio-zona estatal (Haesbaert).", "conexoes": [["Mendon├ºa & Fontes", "leitura pr├®via recomendada (p. 63)."], ["R├®mond", "autonomia do pol├¡tico ├ù Estado como rela├º├úo."], ["Thompson", "lutas populares e Estado."]], "projeto": {"uso": "A Marinha ├® aparelho de Estado; Poulantzas ajuda a n├úo trat├í-la como bloco unit├írio (p. 153): h├í redes, feudos e micropol├¡ticas (p. 156), o que conversa com a autoridade informal. O \"pessoal de Estado\" dos escal├Áes intermedi├írios e subalternos (p. 178) aproxima-se das pra├ºas e suboficiais.", "cits": [["153", "├® preciso abandonar definitivamente uma vis├úo do Estado como um dispositivo unit├írio de alto a baixo"], ["156", "uma multid├úo de micropol├¡ticas diversificadas"]], "prova": "Use em quest├Áes sobre Estado, poder e lutas sociais.", "arg": "Se perguntarem sobre a rela├º├úo entre seu estudo micro e o Estado: a OM ├® um fragmento de um aparelho atravessado por contradi├º├Áes, n├úo uma miniatura do Estado."}, "ex_comp": [["Por que o Estado n├úo ├® \"coisa\" nem \"sujeito\"?", "Porque n├úo ├® instrumento neutro de uma classe nem ente com vontade pr├│pria; ├® condensa├º├úo de rela├º├Áes de for├ºa (p. 147)."], ["O que s├úo as micropol├¡ticas no Estado?", "Feudos, cl├ús e fac├º├Áes que fazem do Estado um campo estrat├®gico n├úo unit├írio (pp. 156ÔÇô157)."]], "ex_diss": ["Discuta a concep├º├úo do Estado como \"condensa├º├úo material de uma rela├º├úo de for├ºas\" e suas implica├º├Áes para as lutas pol├¡ticas.", ["Cr├¡tica a Coisa/Sujeito (p. 147).", "Unidade das classes dominantes (pp. 144ÔÇô145).", "Divis├Áes e micropol├¡ticas (pp. 152ÔÇô157).", "Lutas populares; cr├¡tica a Foucault (pp. 162, 172ÔÇô174).", "Conclus├úo com Mendon├ºa & Fontes."]], "off": null}], "sim": [{"sec": "area", "q": "<b class=\"n\">A1.<\/b> \"Todo territ├│rio ├®, ao mesmo tempo e obrigatoriamente, em diferentes combina├º├Áes, funcional e simb├│lico.\" Discuta essa proposi├º├úo de Rog├®rio Haesbaert e mostre, com base em pelo menos dois outros autores da bibliografia, como ela pode orientar uma pesquisa em hist├│ria social.", "esq": "<b>Esquema.<\/b> <i>Tese:<\/i> a combina├º├úo funcional/simb├│lico permite ao historiador tratar o territ├│rio como rela├º├úo de poder historicamente vari├ível, e n├úo como palco. (1) Haesbaert: domina├º├úo ├ù apropria├º├úo (Lefebvre); continuum; quadro dos tipos ideais; territ├│rio ├ù territorialidade; historicidade dos fins da territorializa├º├úo. (2) Thompson (costume): cercamentos e direitos comunais, a passagem da apropria├º├úo costumeira ├á domina├º├úo propriet├íria, que mostra a dimens├úo simb├│lica (costume, legitimidade) insepar├ível da funcional (recurso). (3) Koselleck: \"territ├│rio\" como conceito hist├│rico, cujos sentidos mudam; an├ílise diacr├┤nica do vocabul├írio das fontes. (4) Ginzburg ou Certeau: como ler vest├¡gios e o lugar de produ├º├úo das fontes sobre o territ├│rio. <i>Conclus├úo:<\/i> pesquisar territ├│rio ├® reconstruir quem domina, quem se apropria e com que sentidos, num tempo determinado. <i>Erros a evitar:<\/i> tratar a cita├º├úo como dogma (vale problematizar: \"a frase de Haesbaert ├® uma tese, e cabe mostrar como ela funciona\"); esquecer a historicidade."}, {"sec": "area", "q": "<b class=\"n\">A2.<\/b> Discuta as rela├º├Áes entre mem├│ria, hist├│ria e escrita da hist├│ria, articulando Catroga e Certeau. De que modo essas rela├º├Áes se manifestam na produ├º├úo de territ├│rios e identidades?", "esq": "<b>Esquema.<\/b> <i>Tese:<\/i> a historiografia n├úo est├í fora da mem├│ria; ela ├® uma opera├º├úo situada que tamb├®m produz pertencimento a espa├ºos. (1) Catroga: mem├│ria (seletiva, afetiva, ritual, com esquecimento) ├ù hist├│ria (cr├¡tica, verdade); a historiografia nacional como produtora de mem├│ria e \"religi├úo c├¡vica\". (2) Certeau: lugar social, pr├ítica e escrita; a escrita como rela├º├úo com os mortos, que separa e \"d├í lugar\". (3) Converg├¬ncia: dimens├úo ritual e institucional da historiografia. Tens├úo: Catroga mant├®m a pretens├úo cr├¡tica de verdade; Certeau acentua o condicionamento institucional. (4) Territ├│rio: lugares de mem├│ria, p├ítria e regi├úo como inven├º├Áes (Albuquerque Jr.); territ├│rio simb├│lico (Haesbaert). <i>Conclus├úo:<\/i> a vigil├óncia cr├¡tica sobre o lugar e os usos da mem├│ria ├® condi├º├úo para uma hist├│ria social do territ├│rio."}, {"sec": "area", "q": "<b class=\"n\">A3.<\/b> Como as no├º├Áes de tempo hist├│rico em Koselleck e de regime de historicidade (Albuquerque Jr., a partir de Hartog) contribuem para a an├ílise de perman├¬ncias e mudan├ºas nas rela├º├Áes sociais e territoriais?", "esq": "<b>Esquema.<\/b> <i>Tese:<\/i> pensar o tempo como plural (camadas, experi├¬ncia e expectativa, regimes) permite ver como passados diferentes continuam operando no presente. (1) Koselleck: conceitos como indicadores e fatores; sincronia e diacronia; espa├ºo de experi├¬ncia e horizonte de expectativa; a modernidade como temporaliza├º├úo. (2) Albuquerque Jr.: uso ir├┤nico do regime de historicidade de Hartog (regime como \"dieta de temporalidades\", pp. 21, 25); desnaturalizar o tempo (p. 24); ucronia em vez de anacronismo (p. 29); ensino. (3) Thompson: o costume como passado atuante e o choque entre o tempo do costume e o tempo do mercado; exemplo concreto de \"contemporaneidade do n├úo contempor├óneo\". (4) Territ├│rio: o espa├ºo como ac├║mulo de tempos (formas antigas reapropriadas); multiterritorialidade e historicidade do territ├│rio em Haesbaert. <i>Conclus├úo:<\/i> perman├¬ncia n├úo ├® repeti├º├úo, pois pr├íticas semelhantes ganham sentidos novos."}, {"sec": "area", "q": "<b class=\"n\">A4.<\/b> \"O conhecimento hist├│rico ├® indireto, indici├írio e conjectural\" (proposi├º├úo formulada para este simulado, n├úo cita├º├úo). Discuta essa afirma├º├úo com base em Ginzburg, relacionando-a ├ás no├º├Áes de opera├º├úo historiogr├ífica (Certeau) e de costume (Thompson).", "esq": "<b>Esquema.<\/b> (1) Ginzburg: Morelli, Holmes, Freud; ca├ºador e semi├│tica m├®dica; indici├írio ├ù galileano; o dilema do rigor. (2) Certeau: o documento ├® fabricado pela pr├ítica, e o desvio ├® produtivo. (3) Thompson: a cultura popular reconstru├¡da por fontes de elites (processos, correspond├¬ncia de magistrados), lidas a contrapelo; o costume aparece como ind├¡cio nas rea├º├Áes populares. (4) Territ├│rio: rastros no espa├ºo (marcos, cercas, usos). <i>Conclus├úo:<\/i> conjectural n├úo quer dizer arbitr├írio, porque h├í controle por cruzamento de ind├¡cios, explicita├º├úo do lugar e cr├¡tica conceitual."}, {"sec": "area", "q": "<b class=\"n\">A5.<\/b> A partir da bibliografia indicada, discuta como o historiador pode estudar as rela├º├Áes de poder que se expressam no espa├ºo, considerando ao mesmo tempo as estruturas de domina├º├úo e as pr├íticas de apropria├º├úo dos sujeitos.", "esq": "<b>Esquema.<\/b> (1) Haesbaert: poder expl├¡cito e simb├│lico; Sack (controle de acesso); quatro fins da territorializa├º├úo, entre eles a disciplinariza├º├úo pelo espa├ºo. (2) Thompson: plebe ├ù gentry, costume rebelde, apropria├º├úo. (3) Certeau, se usar a extens├úo de <i>A inven├º├úo do cotidiano<\/i> identificando a obra: estrat├®gias e t├íticas, lugar ├ù espa├ºo praticado. Se n├úo, use Certeau para o lugar social das fontes do poder. (4) Ginzburg: escala reduzida que torna vis├¡veis as rela├º├Áes. <i>Conclus├úo:<\/i> o territ├│rio ├® efeito e meio das rela├º├Áes de poder, e a pesquisa precisa juntar norma, pr├ítica e experi├¬ncia."}, {"sec": "area", "q": "<b class=\"n\">A-extra (para o simulado 3).<\/b> Discuta, com base em pelo menos tr├¬s autores da bibliografia, a historicidade dos conceitos com que o historiador trabalha, tomando o conceito de territ├│rio como exemplo.", "esq": "<b>Esquema.<\/b> Koselleck (centro) + Haesbaert (o debate conceitual sobre territ├│rio e territorialidade; a etimologia; as mudan├ºas hist├│ricas dos fins da territorializa├º├úo) + Certeau (o lugar do historiador e de sua linguagem) + Albuquerque Jr. ou Catroga (narrativas e mem├│rias que d├úo sentido ao espa├ºo). Conclus├úo: conceitos s├úo instrumentos e objetos da hist├│ria."}, {"sec": "linha", "q": "<b class=\"n\">L1.<\/b> Analise o conceito de economia moral de E. P. Thompson e discuta sua contribui├º├úo para o estudo dos movimentos sociais, dialogando com a proposta de uma hist├│ria \"de baixo para cima\" de Hobsbawm.", "esq": "<b>Esquema.<\/b> <i>Tese:<\/i> a economia moral mostra que a a├º├úo popular tem racionalidade e legitimidade pr├│prias, o que exige da hist├│ria de baixo teoria e cr├¡tica de fontes. (1) Cr├¡tica ├á vis├úo espasm├│dica; motins disciplinados; no├º├úo legitimadora; modelo paternalista ├ù economia pol├¡tica; taxa├º├úo popular; papel das mulheres. (2) Hobsbawm: origem da hist├│ria de baixo nos movimentos de massa; problema das fontes; necessidade de modelos; cr├¡tica ao romantismo. (3) Converg├¬ncia: os de baixo como sujeitos. Tens├úo: experi├¬ncia e ag├¬ncia (Thompson) ├ù estrutura e modelo (Hobsbawm). (4) Territ├│rio: mercado local ├ù circula├º├úo; espa├ºos do motim. (5) Rela├º├Áes de poder: reciprocidade e press├úo com a gentry; Estado paternalista. <i>Conclus├úo:<\/i> movimentos sociais s├úo rela├º├Áes de for├ºa com dimens├úo moral e territorial."}, {"sec": "linha", "q": "<b class=\"n\">L2.<\/b> Compare as propostas de Ren├® R├®mond e de Sonia Mendon├ºa &amp; Virg├¡nia Fontes para a hist├│ria pol├¡tica. Em que medida elas divergem quanto ├á concep├º├úo de Estado e de pol├¡tico?", "esq": "<b>Esquema.<\/b> (1) R├®mond: cr├¡tica dos Annales ├á hist├│ria pol├¡tica tradicional; nova hist├│ria pol├¡tica (interdisciplinar, longa dura├º├úo, massas, cultura pol├¡tica, opini├úo); fronteiras m├│veis do pol├¡tico; autonomia relativa; tempo presente. (2) Mendon├ºa &amp; Fontes: Estado ampliado (Gramsci); hegemonia; aparelhos privados de hegemonia; cr├¡tica ├á autonomiza├º├úo do pol├¡tico e ├ás dicotomias Estado ├ù sociedade. (3) Diverg├¬ncia central: o pol├¡tico como esfera pr├│pria ├ù o pol├¡tico como condensa├º├úo das rela├º├Áes sociais e de classe. Converg├¬ncia: ambos recusam a hist├│ria pol├¡tica factual e o Estado como \"coisa dada\". (4) Poulantzas como refor├ºo do segundo polo. (5) Territ├│rio: para R├®mond, a geografia pol├¡tica; para M&amp;F, as pol├¡ticas estatais e as fra├º├Áes regionais. <i>Conclus├úo:<\/i> posicione-se de forma argumentada, por exemplo incorporando a amplia├º├úo de objetos de R├®mond sem abrir m├úo de explicar o pol├¡tico pelas rela├º├Áes sociais."}, {"sec": "linha", "q": "<b class=\"n\">L3.<\/b> Poulantzas define o Estado como condensa├º├úo material de uma rela├º├úo de for├ºas entre classes e fra├º├Áes de classe. Discuta a concep├º├úo de Estado de Nicos Poulantzas e suas implica├º├Áes para o estudo das lutas sociais e das rela├º├Áes de poder no territ├│rio.", "esq": "<b>Esquema.<\/b> (1) Contra o Estado-coisa (instrumento) e o Estado-sujeito; o Estado como rela├º├úo. (2) Bloco no poder, hegemonia, fra├º├Áes; contradi├º├Áes internas aos aparelhos; seletividade; autonomia relativa; materialidade institucional. (3) Lutas populares inscritas no Estado: n├úo h├í \"fora\" absoluto. (4) Di├ílogo: Mendon├ºa &amp; Fontes (Estado ampliado); Thompson (paternalismo e multid├úo, a luta popular for├ºando a a├º├úo ou a toler├óncia das autoridades). (5) Territ├│rio: escalas dos aparelhos; o Estado-na├º├úo como territorializa├º├úo exclusiva (Haesbaert); men├º├úo, identificada como extens├úo, ├á matriz espacial do Estado moderno em outra parte do livro. <i>Conclus├úo:<\/i> estudar o Estado ├® estudar lutas, inclusive as que passam por dentro de suas institui├º├Áes."}, {"sec": "linha", "q": "<b class=\"n\">L4.<\/b> Com base na bibliografia da Linha, discuta como rela├º├Áes de poder, movimentos sociais e territ├│rio se articulam na pesquisa hist├│rica.", "esq": "<b>Esquema.<\/b> Pergunta \"guarda-chuva\": organize por eixos, e n├úo por autores. (1) O que ├® poder pol├¡tico e onde est├í (R├®mond ├ù M&amp;F; Poulantzas). (2) Quem s├úo os sujeitos (Hobsbawm; Thompson). (3) Como a luta se territorializa (economia moral e mercado local; Estado e escalas). (4) Implica├º├Áes metodol├│gicas: fontes, teoria e escala. Conclus├úo com uma tese pr├│pria."}, {"sec": "linha", "q": "<b class=\"n\">L-extra (para o simulado 3).<\/b> A hist├│ria do tempo presente e a renova├º├úo da hist├│ria pol├¡tica: discuta as possibilidades e os limites do estudo hist├│rico de institui├º├Áes e conflitos contempor├óneos, com base em R├®mond e em pelo menos outro autor da Linha.", "esq": "<b>Esquema.<\/b> R├®mond (legitimidade do tempo presente; proximidade ├ù dist├óncia; fontes abundantes e lacunas; interdisciplinaridade) + Hobsbawm (hist├│ria oral e mem├│ria; anacronismo) + Poulantzas ou M&amp;F (institui├º├Áes estatais como rela├º├Áes) + uma men├º├úo a Catroga ou Certeau (lugar e mem├│ria). Limites: falta de recuo, acesso a arquivos, envolvimento do pesquisador. Possibilidades: testemunhos, acompanhamento de processos em curso."}, {"sec": "area", "q": "<b>Apostila.<\/b> \"Todo territ├│rio ├®, ao mesmo tempo, funcional e simb├│lico\" (Haesbaert). Discuta como essa concep├º├úo permite articular territ├│rio, mem├│ria e rela├º├Áes de poder, mobilizando pelo menos dois outros autores da bibliografia.", "esq": "<ul><li>Defini├º├úo relacional (Haesbaert, pp. 20ÔÇô23).<\/li><li>Mem├│ria territorializada: lugares, monumentos, comemora├º├Áes (Catroga, pp. 23ÔÇô24, 55).<\/li><li>Costume e apropria├º├úo (Thompson, p. 17).<\/li><li>Conclus├úo: territ├│rio como produto hist├│rico
